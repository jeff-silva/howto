version: "3.8"

services:
  backend:
    build: ./backend
    ports: ["3000:3000"]
    volumes:
      - ./backend/project:/app
    environment:
      NODE_ENV: development
    command: bun --watch run src/index.ts

  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: elysia_db
    ports: ["5432:5432"]
    volumes:
      - pgdata_volume:/var/lib/postgresql/data

volumes:
  pgdata_volume:
