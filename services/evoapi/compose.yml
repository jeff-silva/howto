services:
  service-evoapi:
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    expose: [8080]
    env_file: [./.env]
    volumes:
      - instances_volume:/evolution/instances
      - store_volume:/evolution/store
    environment:
      - PORT=8080
      - AUTHENTICATION_TYPE=apikey
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:app@db:5432/postgres?schema=evoapi
      - DATABASE_CONNECTION_CLIENT_NAME=evoapi
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://service-redis:6379
      - CACHE_REDIS_PREFIX_KEY=evoapi
      - CACHE_REDIS_SAVE_INSTANCES=true

volumes:
  instances_volume:
  store_volume:
