    <script type="module">
        function applyScrambleText(tl, selector, startTime) {
            const split = new SplitType(selector, { types: 'words, chars' });
            const chars = split.chars;
            if (!chars) return;
            const charSet = "@#$%&01X?";
            
            const element = document.querySelector(selector);
            if (element && element.parentElement) {
                tl.set(element.parentElement, { opacity: 1, scale: 1, y: 0 }, startTime);
            }
            tl.set(selector, { opacity: 1, scale: 1 }, startTime);

            tl.fromTo(chars, 
                { opacity: 0, scale: 3, z: 200, rotationX: 90 }, 
                { opacity: 1, scale: 1, z: 0, rotationX: 0, stagger: 0.05, duration: 0.4, ease: "power4.out" }, 
                startTime
            );

            chars.forEach((char, i) => {
                const originalText = char.innerText;
                if (!originalText.trim()) return;
                const dummy = { p: 0 };
                tl.to(dummy, {
                    p: 100, duration: 0.4,
                    onUpdate: function() {
                        if (this.progress() < 0.8) {
                            char.innerText = charSet[Math.floor(Math.random() * charSet.length)];
                        } else {
                            char.innerText = originalText;
                        }
                    },
                    onComplete: function() { char.innerText = originalText; }
                }, startTime + (i * 0.05));
            });
        }

        function createFloatingEmojis(tl, containerSelector, startTime, duration) {
            const container = document.querySelector(containerSelector);
            if (!container) return;
            const emojis = [
                'noto:thumbs-up', 'noto:red-heart', 'noto:fire', 'noto:rocket', 
                'noto:clapping-hands', 'noto:hundred-points', 'noto:star-struck', 'noto:direct-hit'
            ];
            const numEmojis = 30;
            for (let i = 0; i < numEmojis; i++) {
                const el = document.createElement("div");
                el.className = "absolute text-[80px] opacity-0 flex items-center justify-center";
                const icon = emojis[Math.floor(Math.random() * emojis.length)];
                el.innerHTML = `<iconify-icon icon="${icon}"></iconify-icon>`;
                container.appendChild(el);
                
                const delay = Math.random() * duration; 
                const startX = 100 + Math.random() * 880;
                const endX = startX + (Math.random() * 400 - 200);
                const animDuration = 4 + Math.random() * 3; 
                tl.fromTo(el, 
                    { x: startX, y: 1920, opacity: 0, scale: 0.5 + Math.random() },
                    { x: endX, y: -200, opacity: 1, scale: 1 + Math.random(), duration: animDuration, ease: "power1.out" },
                    startTime + delay
                );
                tl.to(el, { opacity: 0, duration: 0.8 }, startTime + delay + (animDuration * 0.8));
            }
        }

        window.__timelines = window.__timelines || {};
        const mainTl = gsap.timeline({ paused: true });
        
        // Grid Animation
        mainTl.to(".bg-grid", { backgroundPosition: "100px 100px", duration: 2, repeat: 100, ease: "none" }, 0);

        // Seq 1 (0 to 9.72)
        mainTl.set("#seq1", { opacity: 1 }, 0);
        mainTl.fromTo("#seq1_mic", { scale: 0.5, opacity: 0, y: 200 }, { scale: 1, opacity: 1, y: 0, duration: 1, ease: "back.out(1.5)" }, 0);
        mainTl.to("#seq1_note1", { y: -50, opacity: 1, duration: 0.5, ease: "power2.out" }, 1.5);
        mainTl.to("#seq1_note2", { y: -50, opacity: 1, duration: 0.5, ease: "power2.out" }, 2.0);
        
        mainTl.to("#seq1_mic", { x: -1500, duration: 0.8, ease: "power2.in" }, 3.5); // organic exit
        mainTl.fromTo("#seq1_globe", { x: 1500, opacity: 0 }, { x: 0, opacity: 1, duration: 1, ease: "power3.out" }, 4.0); // organic entry
        
        const waveContainer = document.getElementById("seq1_waves");
        for(let i=0; i<3; i++) {
            const circle = document.createElement("div");
            circle.className = "absolute border-[8px] border-neon-purple rounded-full";
            waveContainer.appendChild(circle);
            mainTl.fromTo(circle, { width: 0, height: 0, opacity: 1 }, { width: 800, height: 800, opacity: 0, duration: 2, ease: "power2.out" }, 4.5 + i*0.5);
        }
        mainTl.to("#seq1_globe", { x: -1500, duration: 0.8, ease: "power2.in" }, 9.0);
        mainTl.set("#seq1", { opacity: 0 }, 9.72);

        // Seq 2 (9.72 to 19.1)
        mainTl.set("#seq2", { opacity: 1 }, 9.72);
        mainTl.fromTo("#seq2_store", { scale: 0.5, y: 500, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: 1, ease: "back.out(1.5)" }, 9.72);
        mainTl.to("#seq2_store", { x: -1500, duration: 0.8, ease: "power2.in" }, 14.5);
        
        mainTl.fromTo("#seq2_network", { x: 1500, opacity: 0 }, { x: 0, opacity: 1, duration: 1, ease: "power3.out" }, 15.0);
        mainTl.to(".spin-slow", { rotation: 360, duration: 5, ease: "none", repeat: 2 }, 15.0);
        mainTl.to("#seq2_network", { scale: 0, opacity: 0, duration: 0.6, ease: "back.in(1.2)" }, 18.5);
        mainTl.set("#seq2", { opacity: 0 }, 19.1);

        // Seq 3 (19.1 to 32.4)
        mainTl.set("#seq3", { opacity: 1 }, 19.1);
        mainTl.to("#seq3_servers", { opacity: 1, duration: 0.2 }, 19.1);
        mainTl.from(".srv", { x: 1500, opacity: 0, stagger: 0.3, duration: 1, ease: "back.out(1.2)" }, 19.1);
        mainTl.to(".glow-bar", { x: "100%", duration: 1.5, repeat: 10, ease: "none" }, 19.1);

        mainTl.to("#seq3_servers", { x: -1500, duration: 0.8, ease: "power2.in" }, 25.5);
        mainTl.fromTo("#seq3_mixer", { y: 800, opacity: 0 }, { y: 0, opacity: 1, duration: 1, ease: "back.out(1.5)" }, 26.0);
        mainTl.to("#seq3_mixer", { scale: 0.5, opacity: 0, duration: 0.6, ease: "power2.in" }, 31.8);
        mainTl.set("#seq3", { opacity: 0 }, 32.4);

        // Seq 4 (32.4 to 47.2)
        mainTl.set("#seq4", { opacity: 1 }, 32.4);
        
        // Cena 1
        mainTl.fromTo("#seq4_c1", { scale: 0.5, opacity: 0, y: 500 }, { scale: 1, opacity: 1, y: 0, duration: 0.8, ease: "back.out(1.5)" }, 32.4);
        mainTl.to("#clock_icon", { rotation: 360, duration: 5, ease: "none" }, 32.4);
        applyScrambleText(mainTl, "#stamp_text", 37.0);
        mainTl.to("#seq4_c1", { x: -1500, duration: 0.6, ease: "power2.in" }, 37.5);

        // Cena 2
        mainTl.fromTo("#seq4_c2", { x: 1500, opacity: 0 }, { x: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, 37.9);
        applyScrambleText(mainTl, "#stamp_text", 41.0);
        mainTl.to("#seq4_c2", { x: -1500, duration: 0.6, ease: "power2.in" }, 41.6);

        // Cena 3
        mainTl.fromTo("#seq4_c3", { x: 1500, opacity: 0 }, { x: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, 42.0);
        applyScrambleText(mainTl, "#stamp_text", 45.6);
        
        mainTl.to("#seq4_c3", { y: -1500, duration: 0.6, ease: "power2.in" }, 46.5);
        mainTl.to("#seq4_stamp", { opacity: 0, duration: 0.4 }, 46.5);
        mainTl.set("#seq4", { opacity: 0 }, 47.2);

        // Seq 5 (47.2 to 53.9)
        mainTl.set("#seq5", { opacity: 1 }, 47.2);
        mainTl.to("#seq5_bg", { opacity: 1, duration: 0.5 }, 47.2);
        mainTl.fromTo("#seq5_plane", { x: -1500, y: 800, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 1, ease: "power3.out" }, 47.5);
        mainTl.to("#seq5_plane", { x: 50, y: -50, duration: 0.5, yoyo: true, repeat: 10 }, 48.5);
        mainTl.to("#seq5_cta", { scale: 1, opacity: 1, duration: 1, ease: "elastic.out(1,0.5)" }, 48.0);
        
        mainTl.to("#seq5_plane", { x: 1500, y: -800, duration: 0.8, ease: "power2.in" }, 53.0);
        mainTl.to("#seq5_cta", { scale: 0, duration: 0.5, ease: "back.in(1.5)" }, 53.2);
        mainTl.set("#seq5", { opacity: 0 }, 53.9);

        // Seq 6 (53.9 to 60)
        mainTl.set("#seq6", { opacity: 1 }, 53.9);
        mainTl.fromTo("#seq6_logo", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.5, ease: "elastic.out(1,0.5)" }, 53.9);
        mainTl.fromTo("#seq6_tag", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 1, ease: "power2.out" }, 55.0);
        
        createFloatingEmojis(mainTl, "#seq6_emojis", 54.0, 5.0);
        
        mainTl.to("#fade_to_black", { opacity: 1, duration: 1.0 }, 59.0);

        // ==========================================
        // Legendas Dinâmicas (Karaoke)
        // ==========================================
        if (typeof AUDIO_WORDS !== 'undefined') {
            const chunks = [
                { id: "seq1_cap1", start: 0, end: 10, fadeOutAt: 3.5 },
                { id: "seq1_cap2", start: 10, end: 29, fadeOutAt: 9.7 },
                { id: "seq2_cap1", start: 29, end: 43, fadeOutAt: 15.5 },
                { id: "seq2_cap2", start: 43, end: 54, fadeOutAt: 19.1 },
                { id: "seq3_cap1", start: 54, end: 68, fadeOutAt: 26.0 },
                { id: "seq3_cap2", start: 68, end: 77, fadeOutAt: 32.4 },
                { id: "seq4_cap1", start: 77, end: 88, fadeOutAt: 37.6 },
                { id: "seq4_cap2", start: 88, end: 95, fadeOutAt: 41.7 },
                { id: "seq4_cap3", start: 95, end: 102, fadeOutAt: 47.0 },
                { id: "seq5_cap1", start: 102, end: 116, fadeOutAt: 53.5 },
                { id: "seq6_cap1", start: 116, end: 127, fadeOutAt: 59.0 }
            ];

            chunks.forEach((chunk) => {
                const container = document.getElementById(chunk.id);
                if (!container) return;
                
                const words = AUDIO_WORDS.slice(Math.min(chunk.start, AUDIO_WORDS.length-1), Math.min(chunk.end, AUDIO_WORDS.length));
                if (words.length === 0) return;

                const firstWordStart = words[0].start;
                // Entry transition for captions
                mainTl.fromTo(container, { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, firstWordStart);

                words.forEach((w) => {
                    const span = document.createElement("span");
                    span.innerText = w.word;
                    span.style.opacity = "0.3";
                    container.appendChild(span);
                    
                    mainTl.to(span, {
                        color: "#fff",
                        textShadow: "0 0 20px rgba(255,255,255,0.8)",
                        opacity: 1,
                        scale: 1.1,
                        duration: 0.1
                    }, w.start);
                    
                    mainTl.to(span, {
                        scale: 1.0,
                        duration: 0.2
                    }, w.start + 0.1);
                });
                
                // Exit transition for captions
                mainTl.to(container, { y: -20, opacity: 0, duration: 0.4, ease: "power2.in" }, chunk.fadeOutAt);
            });
        }

        window.__timelines["main"] = mainTl;
    </script>
  </body>
</html>
