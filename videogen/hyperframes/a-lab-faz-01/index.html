  <script>
    
    // Seeded Random
    let m_w = 123456789;
    let m_z = 987654321;
    let mask = 0xffffffff;
    function random() {
      m_z = (36969 * (m_z & 65535) + (m_z >> 16)) & mask;
      m_w = (18000 * (m_w & 65535) + (m_w >> 16)) & mask;
      let result = ((m_z << 16) + m_w) & mask;
      result /= 4294967296;
      return result + 0.5;
    }

    // Initialize ApexCharts
    const apexOptions = {
      series: [{
        name: 'Receita',
        data: [100, 90, 80, 50, 20, 5]
      }],
      chart: {
        type: 'area',
        height: '100%',
        width: '100%',
        animations: { enabled: false }, // Disable animation so GSAP can scrub properly
        toolbar: { show: false },
        background: 'transparent'
      },
      colors: ['#000000'],
      fill: {
        type: 'gradient',
        gradient: {
          shadeIntensity: 1,
          opacityFrom: 0.6,
          opacityTo: 0.0,
          stops: [0, 90, 100]
        }
      },
      dataLabels: { enabled: false },
      stroke: {
        curve: 'smooth',
        width: 10,
        colors: ['#000000']
      },
      xaxis: {
        categories: ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun'],
        labels: { style: { colors: '#ffffff', fontSize: '28px', fontFamily: 'Share Tech' } },
        axisBorder: { show: false },
        axisTicks: { show: false }
      },
      yaxis: {
        labels: { style: { colors: '#ffffff', fontSize: '28px', fontFamily: 'Share Tech' } }
      },
      grid: {
        borderColor: 'rgba(255,255,255,0.3)',
        strokeDashArray: 6,
      },
      theme: { mode: 'dark' }
    };
    const apexChart = new ApexCharts(document.querySelector("#apex-chart"), apexOptions);
    apexChart.render();

    // Populate money for scene 2
    const moneyContainer = document.getElementById('money-container');
    for(let i=0; i<30; i++) {
      const money = document.createElement('div');
      money.className = 'absolute bottom-[300px] left-1/2 -translate-x-1/2 opacity-0 money-item';
      money.innerHTML = '<div class="relative"><iconify-icon icon="twemoji:money-with-wings" width="120" height="120"></iconify-icon><iconify-icon icon="twemoji:fire" width="80" height="80" class="absolute bottom-0 right-0"></iconify-icon></div>';
      moneyContainer.appendChild(money);
    }

    // Populate reactions for scene 4
    const reactions = ['twemoji:red-heart', 'twemoji:thumbs-up', 'twemoji:grinning-face-with-big-eyes', 'twemoji:fire', 'twemoji:rocket'];
    const rxContainer = document.getElementById('reactions-container');
    for(let i=0; i<40; i++) {
      const rx = document.createElement('div');
      rx.className = 'absolute bottom-[-100px] opacity-0 rx-item';
      rx.style.left = random() * 800 + 140 + 'px';
      rx.innerHTML = `<iconify-icon icon="${reactions[i%reactions.length]}" width="80" height="80"></iconify-icon>`;
      rxContainer.appendChild(rx);
    }
    
    // Populate sad reactions for scene 8
    const sadReactions = ['twemoji:frowning-face', 'twemoji:crying-face', 'twemoji:loudly-crying-face', 'twemoji:broken-heart'];
    const sadContainer = document.getElementById('sad-reactions');
    for(let i=0; i<30; i++) {
      const sx = document.createElement('div');
      sx.className = 'absolute top-[-100px] opacity-0 sx-item';
      sx.style.left = random() * 800 + 140 + 'px';
      sx.innerHTML = `<iconify-icon icon="${sadReactions[i%sadReactions.length]}" width="120" height="120"></iconify-icon>`;
      sadContainer.appendChild(sx);
    }

    // GSAP Setup
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["main"] = tl;

    // BGM Audio handling in GSAP
    let bgmObj = { vol: 0.15 };
    const bgmEl = document.getElementById('bgm');
    const voiceEl = document.getElementById('voice');
    
    // Helper to sync audio in Studio/preview
    // Using timeline to trigger audio logic if allowed by browser
    tl.to(bgmObj, {
      vol: 0,
      duration: 3,
      onUpdate: () => { if(bgmEl) bgmEl.volume = bgmObj.vol; }
    }, 52.7);

    // ==========================================
    // CENA 1: 0.00s a 6.24s
    // ==========================================
    tl.fromTo("#card", 
      { y: -1000, rotationZ: -45, rotationY: -180 }, 
      { y: 0, rotationZ: 0, rotationY: 0, duration: 1.5, ease: "bounce.out" }, 
    0);
    tl.to("#card-shadow", { scale: 1, duration: 1.5, ease: "bounce.out" }, 0);
    
    // Flash e mudança aos 4.0s
    tl.to("#scene1-flash", { opacity: 1, duration: 0.1 }, 4.0);
    tl.set("#scene1-end", { display: "flex" }, 4.05);
    tl.fromTo("#scene1-text", 
      { scale: 3, opacity: 0 }, 
      { scale: 1, opacity: 1, duration: 0.3, ease: "power4.out" }, 
    4.1);
    
    // Camera shake Cena 1
    tl.to("#scene1", {
      x: () => random() * 40 - 20,
      y: () => random() * 40 - 20,
      duration: 0.1,
      repeat: 5,
      yoyo: true,
      ease: "none"
    }, 4.1);
    tl.set("#scene1", { x: 0, y: 0 }, 4.7);

    // ==========================================
    // CENA 2: 6.32s a 12.10s
    // ==========================================
    // Camera shake leve contínuo
    tl.to("#scene2", {
      x: () => random() * 10 - 5,
      y: () => random() * 10 - 5,
      duration: 0.1,
      repeat: 40,
      yoyo: true,
      ease: "none"
    }, 6.32);
    
    // Explosão de dinheiro
    const moneys = document.querySelectorAll('.money-item');
    moneys.forEach((m, i) => {
      tl.to(m, {
        opacity: 1,
        duration: 0.1
      }, 6.5 + i * 0.1);
      tl.to(m, {
        x: (random() - 0.5) * 800,
        y: -random() * 1200 - 200,
        rotationZ: random() * 360,
        duration: 2 + random(),
        ease: "power2.out"
      }, 6.5 + i * 0.1);
    });

    // 10.6s: Lá, parado.
    tl.set(moneys, { clearProps: "animation" }, 10.6); // Parada abrupta (GSAP might need a pause, but setting a tween overriding is better)
    tl.to(moneys, { y: "+=0", duration: 1.5, ease: "none" }, 10.6); // Stop movement roughly
    
    tl.fromTo("#lock", 
      { scale: 3, opacity: 0 }, 
      { scale: 1, opacity: 1, duration: 0.3, ease: "bounce.out" }, 
    10.6);

    // ==========================================
    // CENA 3: 12.10s a 18.18s
    // ==========================================
    tl.fromTo("#phone", { y: 2000 }, { y: 0, duration: 1, ease: "power3.out" }, 12.10);
    tl.to("#whatsapp", { scale: 1, duration: 0.5, ease: "back.out(1.7)" }, 13.5);
    
    // Cruz vermelha batendo e texto
    tl.fromTo("#cross", { scale: 3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power4.inOut" }, 15.5);
    tl.to("#phone", { rotation: -5, x: -20, duration: 0.1, yoyo: true, repeat: 3 }, 15.5);
    
    tl.fromTo("#scene3-text", { y: -200, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "bounce.out" }, 16.0);

    // ==========================================
    // CENA 4: 18.28s a 26.28s
    // ==========================================
    // Zoom dentro da tela do celular (a cor muda por baixo na timeline)
    tl.fromTo("#logo1", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 1, ease: "back.out(1.5)" }, 18.5);
    
    // Reactions subindo
    const rxs = document.querySelectorAll('.rx-item');
    rxs.forEach((rx, i) => {
      let st = 19.5 + random() * 5;
      tl.to(rx, { opacity: 1, duration: 0.2 }, st);
      tl.to(rx, { 
        y: -2200, 
        x: "+=" + (random() * 200 - 100),
        rotation: random() * 90 - 45,
        duration: 3 + random() * 2, 
        ease: "power1.inOut" 
      }, st);
      tl.to(rx, { opacity: 0, duration: 0.5 }, st + 2);
    });

    // ==========================================
    // CENA 5: 26.34s a 30.76s
    // ==========================================
    tl.fromTo("#boleto", { x: -800, opacity: 0, rotation: -45 }, { x: -200, opacity: 1, rotation: -10, duration: 1, ease: "power3.out" }, 26.5);
    tl.fromTo("#creditcard", { x: 800, opacity: 0, rotation: 45 }, { x: 200, opacity: 1, rotation: 15, duration: 1, ease: "power3.out" }, 27.0);
    
    tl.to(["#boleto", "#creditcard"], { y: "-=50", duration: 2, yoyo: true, repeat: 1, ease: "sine.inOut" }, 27.5);
    
    // 29.6s A LAB FAZ
    tl.set("#scene5-end", { display: "flex" }, 29.6);
    tl.fromTo("#scene5-text", { scale: 5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "power4.in" }, 29.6);
    tl.to("#scene5", {
      x: () => random() * 60 - 30,
      y: () => random() * 60 - 30,
      duration: 0.1,
      repeat: 6,
      yoyo: true,
      ease: "none"
    }, 29.8);
    tl.set("#scene5", { x: 0, y: 0 }, 30.5);

    // ==========================================
    // CENA 6: 30.86s a 34.90s
    // ==========================================
    tl.fromTo("#cart", { x: -1000, y: -500, opacity: 1 }, { x: 1000, y: 500, duration: 2, ease: "none" }, 31.0);
    tl.fromTo("#folder", { x: 1000, y: -300, opacity: 1 }, { x: -1000, y: 300, duration: 2, ease: "none" }, 31.5);
    
    tl.fromTo("#cart", { x: -1000, y: 300, opacity: 1 }, { x: 1000, y: -200, duration: 2, ease: "none", immediateRender: false }, 33.0);
    tl.fromTo("#folder", { x: 1000, y: 500, opacity: 1 }, { x: -1000, y: -400, duration: 2, ease: "none", immediateRender: false }, 33.5);
    
    // 34.2s A LAB FAZ com glitch
    tl.set(["#scene6-text", "#scene6-glitch1", "#scene6-glitch2"], { opacity: 1, scale: 1 }, 34.2);
    tl.to("#scene6-glitch1", { x: 15, y: -10, duration: 0.05, repeat: 10, yoyo: true }, 34.2);
    tl.to("#scene6-glitch2", { x: -15, y: 15, duration: 0.05, repeat: 10, yoyo: true }, 34.2);

    // ==========================================
    // CENA 7: 35.46s a 39.84s
    // ==========================================
    tl.fromTo("#email-mockup", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.8, ease: "back.out(1.5)" }, 35.5);
    
    // Simular clique 37.5s
    tl.to("#download-btn", { scale: 0.9, backgroundColor: "#6b21a8", duration: 0.1, yoyo: true, repeat: 1 }, 37.5);
    
    // 39.0s A LAB FAZ
    tl.fromTo("#scene7-text", { scale: 5, opacity: 0 }, { scale: 1.2, opacity: 1, duration: 0.2, ease: "power4.in" }, 39.0);
    tl.to("#scene7", {
      x: () => random() * 50 - 25,
      y: () => random() * 50 - 25,
      duration: 0.1,
      repeat: 5,
      yoyo: true,
      ease: "none"
    }, 39.2);
    tl.set("#scene7", { x: 0, y: 0 }, 39.7);

    // ==========================================
    // CENA 8: 40.44s a 45.76s
    // ==========================================
    tl.fromTo("#chart-container", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 1, ease: "power3.out" }, 40.5);
    
    // Atualizar gráfico para simular queda
    tl.fromTo("#chart-cover", 
      { width: "100%" }, 
      { width: "0%", duration: 3, ease: "none" }, 
    41.5);

    // Animar popups de porcentagem com a queda
    tl.to("#pop-1", { opacity: 1, y: -50, duration: 0.5, ease: "back.out" }, 42.0);
    tl.to("#pop-2", { opacity: 1, y: -50, duration: 0.5, ease: "back.out" }, 42.5);
    tl.to("#pop-3", { opacity: 1, y: -50, scale: 1.2, duration: 0.5, ease: "back.out" }, 43.5);
    
    // Queda das reactions
    const sxs = document.querySelectorAll('.sx-item');
    sxs.forEach((sx, i) => {
      let st = 41.5 + random() * 3;
      tl.to(sx, { opacity: 1, duration: 0.1 }, st);
      tl.to(sx, { 
        y: 2200, 
        x: "+=" + (random() * 200 - 100),
        rotation: random() * 180 - 90,
        duration: 2 + random() * 1.5, 
        ease: "power2.in" 
      }, st);
    });
    
    tl.fromTo("#scene8-text", { scale: 4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "bounce.out" }, 44.5);

    // ==========================================
    // CENA 9: 46.18s a 55.70s
    // ==========================================
    tl.to("#logo9", { y: 0, opacity: 1, duration: 1, ease: "power3.out" }, 46.5);
    
    tl.fromTo("#cta-btn", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.8, ease: "elastic.out(1, 0.5)" }, 47.5);
    tl.to("#cta-btn", { scale: 1.05, duration: 0.8, repeat: 100, yoyo: true, ease: "sine.inOut" }, 48.3);
    
    // Orbs flutuando
    tl.to("#orbs div:nth-child(1)", { x: 100, y: 50, duration: 4, repeat: 100, yoyo: true, ease: "sine.inOut" }, 46.18);
    tl.to("#orbs div:nth-child(2)", { x: -100, y: -50, duration: 5, repeat: 100, yoyo: true, ease: "sine.inOut" }, 46.18);
    
    // Fade to black últimos 2 seg
    tl.to("#fade-black", { opacity: 1, duration: 2 }, 53.7);

  </script>
</body>
</html>
