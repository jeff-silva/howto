<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Google Meu Negócio - Labscript</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=JetBrains+Mono:wght@600&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>

    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js",
          "three/addons/": "./node_modules/three/examples/jsm/"
        }
      }
    </script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0b0f19;
        font-family: "Montserrat", sans-serif;
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }

      #tela3d {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        z-index: 1;
      }

      /* Vinheta sutil e moderna */
      .vinheta {
        position: absolute;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        background: radial-gradient(circle at 50% 50%, transparent 60%, rgba(5, 8, 15, 0.75) 100%);
      }

      /* Transição de flash suave */
      .flash-fx {
        position: absolute;
        inset: 0;
        z-index: 15;
        background: #ffffff;
        opacity: 0;
        pointer-events: none;
      }

      /* Overlay HTML simples para callouts de negócio */
      .card-info {
        position: absolute;
        top: 220px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;
        background: rgba(15, 23, 42, 0.9);
        border: 2px solid rgba(56, 189, 248, 0.4);
        padding: 24px 40px;
        border-radius: 24px;
        backdrop-filter: blur(16px);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        opacity: 0;
        transform: translate(-50%, -20px) scale(0.9);
        pointer-events: none;
      }

      .card-badge {
        font-family: "JetBrains Mono", monospace;
        font-size: 20px;
        color: #38bdf8;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      .card-title {
        font-size: 40px;
        font-weight: 900;
        color: #ffffff;
      }

      .card-stars {
        color: #fbbf24;
        font-size: 28px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="12"
      data-width="1080"
      data-height="1920"
    >
      <canvas id="tela3d" data-start="0" data-track-index="0"></canvas>
      <div class="vinheta"></div>
      <div class="flash-fx" data-start="0" data-track-index="1"></div>

      <div class="card-info clip" data-start="0" data-duration="12">
        <div class="card-badge">Google Business Profile</div>
        <div class="card-title">Sua Empresa no Topo</div>
        <div class="card-stars">★★★★★ 5.0 (Gestão Labscript)</div>
      </div>
    </div>

    <script type="module">
      import * as THREE from 'three';

      // ==========================================
      // 1. SETUP DO THREE.JS (CANVAS 1080x1920)
      // ==========================================
      const canvas = document.getElementById('tela3d');
      const W = 1080;
      const H = 1920;

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#0b1120'); // Tom elegante escuro de mapa Google Maps Dark
      scene.fog = new THREE.FogExp2('#0b1120', 0.03);

      const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 100);

      // Iluminação estilo maquete / tech
      const hemiLight = new THREE.HemisphereLight('#bae6fd', '#0f172a', 0.9);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight('#ffffff', 2.6);
      dirLight.position.set(6, 14, 8);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 1024;
      dirLight.shadow.mapSize.height = 1024;
      scene.add(dirLight);

      const accentLight = new THREE.DirectionalLight('#38bdf8', 1.8);
      accentLight.position.set(-8, 8, -6);
      scene.add(accentLight);

      // ==========================================
      // 2. CONSTRUÇÃO DO MAPA 3D PROCEDURAL
      // ==========================================
      const grupoMapa = new THREE.Group();
      scene.add(grupoMapa);

      // Chão base do mapa (Terreno / quarteirões escuros)
      const chaoGeo = new THREE.PlaneGeometry(60, 60);
      const chaoMat = new THREE.MeshStandardMaterial({
        color: '#0f172a',
        roughness: 0.85,
        flatShading: true
      });
      const chao = new THREE.Mesh(chaoGeo, chaoMat);
      chao.rotation.x = -Math.PI / 2;
      chao.receiveShadow = true;
      grupoMapa.add(chao);

      // Malha de Ruas e Avenidas iluminadas estilo Google Maps Dark Mode
      const matRua = new THREE.MeshStandardMaterial({
        color: '#1e293b',
        roughness: 0.6
      });
      const matLinhaRua = new THREE.MeshBasicMaterial({
        color: '#38bdf8',
        transparent: true,
        opacity: 0.65
      });

      // Vias cruzadas
      function criarRua(largura, comprimento, x, z, rotY = 0) {
        const ruaMesh = new THREE.Mesh(new THREE.PlaneGeometry(largura, comprimento), matRua);
        ruaMesh.rotation.x = -Math.PI / 2;
        ruaMesh.rotation.z = rotY;
        ruaMesh.position.set(x, 0.005, z);
        ruaMesh.receiveShadow = true;
        grupoMapa.add(ruaMesh);

        // Faixa central de neon
        const linhaMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.12, comprimento), matLinhaRua);
        linhaMesh.rotation.x = -Math.PI / 2;
        linhaMesh.rotation.z = rotY;
        linhaMesh.position.set(x, 0.008, z);
        grupoMapa.add(linhaMesh);
      }

      criarRua(2.2, 40, 0, 0, 0); // Avenida principal vertical
      criarRua(1.8, 40, 0, 0, Math.PI / 2); // Avenida cruzada horizontal
      criarRua(1.4, 40, -4.5, 0, 0);
      criarRua(1.4, 40, 4.5, 0, 0);
      criarRua(1.4, 40, 0, -4.5, Math.PI / 2);
      criarRua(1.4, 40, 0, 4.5, Math.PI / 2);

      // Prédios estilizados ao redor (blocos low-poly com topo iluminado)
      const matPredio = new THREE.MeshStandardMaterial({
        color: '#1e293b',
        metalness: 0.2,
        roughness: 0.5
      });
      const matPredioDestaque = new THREE.MeshStandardMaterial({
        color: '#2563eb',
        metalness: 0.3,
        roughness: 0.4
      });

      const posicoesPredios = [
        // Quarteirão Superior Esquerdo
        [-2.4, 1.2, -2.4, 1.6, 2.4, 1.6],
        [-2.4, 0.8, -4.2, 1.4, 1.6, 1.4],
        [-4.2, 1.5, -2.4, 1.5, 3.0, 1.5],
        // Quarteirão Superior Direito
        [2.4, 1.0, -2.4, 1.6, 2.0, 1.6],
        [4.2, 1.4, -2.4, 1.5, 2.8, 1.5],
        [2.4, 0.7, -4.2, 1.4, 1.4, 1.4],
        // Quarteirão Inferior Esquerdo
        [-2.4, 0.9, 2.4, 1.5, 1.8, 1.5],
        [-4.2, 1.2, 2.4, 1.5, 2.4, 1.5],
        // Quarteirão Inferior Direito
        [2.4, 1.1, 2.4, 1.6, 2.2, 1.6],
        [4.2, 0.8, 2.4, 1.5, 1.6, 1.5]
      ];

      posicoesPredios.forEach(([x, h, z, w, altura, d]) => {
        const predio = new THREE.Mesh(
          new THREE.BoxGeometry(w, altura, d),
          matPredio
        );
        predio.position.set(x, altura / 2, z);
        predio.castShadow = true;
        predio.receiveShadow = true;
        grupoMapa.add(predio);
      });

      // ==========================================
      // 3. O PIN DO GOOGLE MAPS (PONTO PRINCIPAL)
      // ==========================================
      const grupoPin = new THREE.Group();
      grupoPin.position.set(0, 0, 0); // No centro da esquina principal
      grupoMapa.add(grupoPin);

      // Círculo de pulso/radar na base do pin (Radar de Localização)
      const radarGeo = new THREE.RingGeometry(0.2, 0.35, 32);
      const radarMat = new THREE.MeshBasicMaterial({
        color: '#38bdf8',
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.8
      });
      const radar = new THREE.Mesh(radarGeo, radarMat);
      radar.rotation.x = -Math.PI / 2;
      radar.position.y = 0.02;
      grupoPin.add(radar);

      // Segundo anel de radar
      const radar2 = radar.clone();
      radar2.material = radarMat.clone();
      grupoPin.add(radar2);

      // Modelo 3D clássico do Pin do Google (Esfera + Cone invertido)
      const grupoPinIcone = new THREE.Group();
      grupoPinIcone.position.y = 1.6; // Altura do pin
      grupoPin.add(grupoPinIcone);

      // Cabeça redonda do Pin
      const cabecaPinGeo = new THREE.SphereGeometry(0.55, 24, 20);
      const matPin = new THREE.MeshStandardMaterial({
        color: '#ef4444', // Vermelho Google Maps oficial
        roughness: 0.2,
        metalness: 0.1,
        emissive: '#dc2626',
        emissiveIntensity: 0.2
      });
      const cabecaPin = new THREE.Mesh(cabecaPinGeo, matPin);
      cabecaPin.castShadow = true;
      grupoPinIcone.add(cabecaPin);

      // Furo central branco do pin
      const furoPinGeo = new THREE.CylinderGeometry(0.22, 0.22, 0.4, 20);
      const matFuro = new THREE.MeshBasicMaterial({ color: '#ffffff' });
      const furoPin = new THREE.Mesh(furoPinGeo, matFuro);
      furoPin.rotation.x = Math.PI / 2;
      furoPin.position.z = 0.38;
      grupoPinIcone.add(furoPin);

      // Ponta do pin (cone apontando para o chão)
      const pontaPinGeo = new THREE.ConeGeometry(0.52, 0.95, 24);
      const pontaPin = new THREE.Mesh(pontaPinGeo, matPin);
      pontaPin.rotation.x = Math.PI;
      pontaPin.position.y = -0.45;
      pontaPin.castShadow = true;
      grupoPinIcone.add(pontaPin);

      // ==========================================
      // 4. TIMELINE GSAP (ANIMAÇÃO DA CÂMERA & PIN)
      // ==========================================
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Estado inicial: Câmera alta em perspectiva isométrica ampla
      tl.set(camera.position, { x: 8, y: 12, z: 12 }, 0);
      tl.call(() => {
        camera.lookAt(0, 0.5, 0);
      }, null, 0);

      // Radar pulsando no chão continuamente
      tl.fromTo(radar.scale, 
        { x: 0.5, y: 0.5 },
        { x: 4.5, y: 4.5, duration: 2.2, repeat: -1, ease: "power1.out" },
        0
      );
      tl.fromTo(radar.material,
        { opacity: 0.9 },
        { opacity: 0, duration: 2.2, repeat: -1, ease: "power1.out" },
        0
      );

      tl.fromTo(radar2.scale,
        { x: 0.5, y: 0.5 },
        { x: 3.5, y: 3.5, duration: 2.2, repeat: -1, ease: "power1.out", delay: 0.9 },
        0
      );
      tl.fromTo(radar2.material,
        { opacity: 0.8 },
        { opacity: 0, duration: 2.2, repeat: -1, ease: "power1.out", delay: 0.9 },
        0
      );

      // Pin caindo do alto e quicando no chão com impacto (Drop Pin)
      tl.fromTo(grupoPinIcone.position,
        { y: 8 },
        { y: 1.5, duration: 1.2, ease: "bounce.out" },
        0.4
      );

      // Rotação suave do Pin para exibir o 3D
      tl.fromTo(grupoPinIcone.rotation,
        { y: -Math.PI },
        { y: 0.2, duration: 1.6, ease: "power2.out" },
        0.4
      );

      // Flutuação contínua e suave do pin após aterrissar
      tl.to(grupoPinIcone.position, {
        y: 1.8,
        duration: 1.5,
        repeat: -1,
        yoyo: true,
        ease: "sine.inOut"
      }, 1.6);

      // Câmera desce suavemente girando ao redor do local de destaque (Orbit Camera)
      tl.to(camera.position, {
        x: 3.5,
        y: 5.5,
        z: 7.5,
        duration: 5,
        ease: "power2.out"
      }, 0);

      // Entrada do Card de Informações da Empresa (1.4s)
      tl.to(".card-info", {
        opacity: 1,
        y: 0,
        scale: 1,
        duration: 0.8,
        ease: "back.out(1.5)"
      }, 1.4);

      // Zoom dinâmico fechando no negócio destacado (a partir dos 5s)
      tl.to(camera.position, {
        x: 1.2,
        y: 3.2,
        z: 4.8,
        duration: 5,
        ease: "power1.inOut"
      }, 5.0);

      // Registra a timeline no HyperFrames
      window.__timelines["main"] = tl;
      tl.seek(0);

      // Loop do Three.js mantendo foco contínuo no Pin
      function loop() {
        camera.lookAt(0, 1.2, 0);
        renderer.render(scene, camera);
        requestAnimationFrame(loop);
      }
      loop();
    </script>
  </body>
</html>
