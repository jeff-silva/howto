<!--
Cena 1:
Texto: Você precisa fazer um video explicativo, com imagens e gráficos.
Imagem: Cena começa com 3 nubens (balões de pensamento) apenas enquadradas,
mostrando respectivamente um gráfico, um quadro com uma imagem e interrogações.
A camera desce e enquadra o personagem da cintura pra cima
fazendo essa expressão com suor na testa: 😬

Cena 2:
Texto: Mas não fala bem para a câmera, nem domina muito ferramentas de edição.
Imagem: Continua da cena anterior, mostrando o personagem.
Então a enquadramento se vira para uma câmera a frente do personagem, apontada para ele.
O enquadramento exibe a câmera por 2 segundos e então volta para o rosto
do personagem em plano fechado.

Cena 3:
Texto: Essa é a animação explicativa.
Imagem: O print do ultimo frame da cena anterior aparece em um smartphone.
Estamos vendo o video sendo reproduzido no celular enquanto o enquadramento
vai se afastando devagar.

Cena 4:
Texto: São animações simples, feitas sem levar muito tempo e que retém atenção.
Imagem: Continua da cena anterior com o smartphone no ar; a tela passa a exibir
gráficos simples animados e dinâmicos simbolizando atenção retida.

Cena 5:
Texto: Elas ajudam a entender algo detalhadamente.
Imagem: Uma pessoa (outro personagem, pode ser uma mulher com outro tom de pele)
está olhando pro celular com semblante preocupado (nao esta entendendo)
então o semblante dela fica mais relaxado (sorriso leve com boca fechada, sombrancelha arqueada, esta entendendo)
então ela olha para nós (camera que enquadra), é como se disesse "agora entendi"

Cena 6:
Texto: É uma ótima ferramenta para explicar como funciona um serviço.
Imagem: Personagem principal, do começo do video, em pé, em frente a um quadro
com coisas incompreensíveis escritas. Ele está com uma varinha apontando para
o quadro, como um professor ensinando.

Cena 7:
Texto: Ou ainda, dar detalhes sobre como participar de uma promoção.
Imagem: Assim como na cena 6, personagem está explicando com uma varinha na mão,
mas dessa vez do lado direito da tela, enquanto do lado esquerdo aparece uma tela
de computador com um mockup de site aberto. O personagem esta explicando
pela imagem do site como participar de uma promoção.

Cena 8:
Texto: Ou talvez comparar seu produto com o da concorrência.
Imagem: Personagem principal no centro entre duas barras (uma cinza baixa à esquerda
e uma verde alta à direita com uma coroa dourada subindo no topo). O personagem
olha acompanhando a coroa subir, enquanto a câmera fecha o plano bem lentamente
no personagem e na barra verde, deixando a barra cinza um pouco para fora.

Cena 9:
Texto: A ideia, você decide. A execução é com a Labscript.
Imagem: Temos apenas o personagem principal em cena. Uma lampada acende
em cima de sua cabeça dele.

Cena 10:
Texto: Você pede e a Lab cria o video pra você em até um dia.
Imagem: Personagem principal segura o celular; uma lâmpada (💡) sai do celular e sobe.
Ao ficar no alto, um relógio aparece atrás da lâmpada e o ponteiro dá duas voltas
rápidas (24h). Tudo vira uma nuvem de fumaça, some e se transforma em um quadrado
preto com ícone de Play (o vídeo pronto).

Cena 11:
Texto: Rápido, fácil e sem gastar muito.
Imagem: Continua à partir do plano anterior, plano fecha bem no rosto do personagem
com uma expressão completamente feliz e satisfeita (😄)

Cena 12:
Texto: Fale com a Lab, vamos colocar sua ideia em prática.
Imagem: Continua do plano anterior, imagem fica embaçada para dar foco na
logo da Labscript que vai aparecer na frente, com um botão abaixo
escrito "Fale com a Lab"

-->

  <body>
    <div
      id="root"
      data-composition-id="main"

    >
      <audio id="narration" src="./assets/tts/labscript-animation/audio.mp3" data-start="0"></audio>
      <audio
        id="bgm"
        src="./assets/labscript-animation/Logical_Progression.mp3"
        data-start="0"
        data-duration="44.2"
        data-volume="0.16"
        data-automation="{&quot;version&quot;:1,&quot;lanes&quot;:[{&quot;target&quot;:&quot;volume&quot;,&quot;points&quot;:[{&quot;t&quot;:0,&quot;v&quot;:1},{&quot;t&quot;:43.2,&quot;v&quot;:1},{&quot;t&quot;:44.2,&quot;v&quot;:0}]}]}"

    <script type="module">
      import * as THREE from 'three';
      import { makeCharacter, applyFaceState } from './3d/characters/makeCharacter.js';

      // ==========================================
      // 1. SETUP DO THREE.JS (1080x1920)
      // ==========================================
      const canvas = document.getElementById('tela3d');
      const W = 1080;
      const H = 1920;

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#070b16');
      scene.fog = new THREE.FogExp2('#070b16', 0.032);

      const camera = new THREE.PerspectiveCamera(42, W / H, 0.1, 100);
      const camTarget = new THREE.Vector3(0, 1.05, 0);

      // Iluminação de estúdio 3 pontos
      scene.add(new THREE.HemisphereLight('#c4e2ff', '#0f172a', 0.9));

      const keyLight = new THREE.DirectionalLight('#ffffff', 2.8);
      keyLight.position.set(4.5, 11, 7);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.width = 1024;
      keyLight.shadow.mapSize.height = 1024;
      scene.add(keyLight);

      const fillLight = new THREE.DirectionalLight('#38bdf8', 1.9);
      fillLight.position.set(-6, 5, -4);
      scene.add(fillLight);

      const rimLight = new THREE.DirectionalLight('#ec4899', 1.8);
      rimLight.position.set(6, 4, -6);
      scene.add(rimLight);

      // ==========================================
      // 2. PALCO PRINCIPAL
      // ==========================================
      const stageGroup = new THREE.Group();
      scene.add(stageGroup);

      const pedestal = new THREE.Mesh(
        new THREE.CylinderGeometry(4.6, 4.9, 0.36, 48),
        new THREE.MeshStandardMaterial({ color: '#0f172a', metalness: 0.55, roughness: 0.35 })
      );
      pedestal.position.y = -0.18;
      pedestal.receiveShadow = true;
      stageGroup.add(pedestal);

      const anelNeon = new THREE.Mesh(
        new THREE.TorusGeometry(4.7, 0.045, 16, 64),
        new THREE.MeshBasicMaterial({ color: '#ec4899' })
      );
      anelNeon.rotation.x = Math.PI / 2;
      stageGroup.add(anelNeon);

      const gridHelper = new THREE.GridHelper(28, 28, '#1e293b', '#0f172a');
      gridHelper.position.y = -0.36;
      scene.add(gridHelper);

      // ==========================================
      // 3. PERSONAGENS (CLIENTE + ANIMADOR LABSCRIPT)
      // ==========================================
      const cliente = makeCharacter({
        name: 'cliente',
        skin: '#e8be9e',
        height: 1.0,
        build: 0.95,
        top: { color: '#2563eb', sleeves: 'short' },
        bottom: { color: '#1e293b', type: 'pants' },
        shoes: '#e2e8f0',
        hair: { style: 'short', color: '#292524' },
        face: { glasses: false }
      });
      scene.add(cliente.root);

      const animador = makeCharacter({
        name: 'animador',
        skin: '#f3cfae',
        height: 1.04,
        build: 0.96,
        top: { color: '#ec4899', sleeves: 'long' },
        bottom: { color: '#18181b', type: 'pants' },
        shoes: '#ffffff',
        hair: { style: 'curly', color: '#262626' },
        hat: { type: 'cap', color: '#0284c7' },
        face: { glasses: true }
      });
      scene.add(animador.root);

      const espectadora = makeCharacter({
        name: 'espectadora',
        skin: '#a9714b',
        height: 0.96,
        build: 0.88,
        silhouette: 'female',
        top: { color: '#14b8a6', sleeves: 'short' },
        bottom: { color: '#14b8a6', type: 'skirt' },
        shoes: '#14b8a6',
        hair: { style: 'bun', color: '#1c1917' },
        face: { glasses: false }
      });
      scene.add(espectadora.root);

      function resetPose(ch) {
        ch.joints.hips.position.set(0, 0.68, 0);
        for (const j of Object.values(ch.joints)) {
          j.rotation.set(0, 0, 0);
        }
      }

      // ==========================================
      // 4. PROPS 3D DAS CENAS EXPLICATIVAS
      // ==========================================
      // 4A. Cena 1: Gota de suor na testa + Expressão 😬 + 3 Balões de pensamento (gráfico, imagem, interrogações)
      const sweatDrop = new THREE.Group();
      const sweatMat = new THREE.MeshStandardMaterial({
        color: '#38bdf8',
        emissive: '#0284c7',
        emissiveIntensity: 0.45,
        roughness: 0.15,
        metalness: 0.1
      });
      const sweatBall = new THREE.Mesh(new THREE.SphereGeometry(0.036, 14, 14), sweatMat);
      const sweatTip = new THREE.Mesh(new THREE.ConeGeometry(0.035, 0.075, 14), sweatMat);
      sweatTip.position.y = 0.042;
      sweatDrop.add(sweatBall, sweatTip);
      sweatDrop.position.set(0.125, 0.215, 0.215);
      sweatDrop.visible = false;
      cliente.joints.head.add(sweatDrop);

      // Expressão 😬 (dentes cerrados) acoplada à boca do cliente
      const grimaceMouth = new THREE.Group();
      const grimaceBorder = new THREE.Mesh(
        new THREE.BoxGeometry(0.125, 0.046, 0.018),
        new THREE.MeshStandardMaterial({ color: '#2b1414', roughness: 0.6 })
      );
      const grimaceTeeth = new THREE.Mesh(
        new THREE.BoxGeometry(0.112, 0.034, 0.022),
        new THREE.MeshStandardMaterial({ color: '#f8fafc', roughness: 0.25, emissive: '#e2e8f0', emissiveIntensity: 0.2 })
      );
      grimaceMouth.add(grimaceBorder, grimaceTeeth);
      const lineMat = new THREE.MeshBasicMaterial({ color: '#334155' });
      const midLine = new THREE.Mesh(new THREE.BoxGeometry(0.112, 0.004, 0.025), lineMat);
      grimaceMouth.add(midLine);
      for (const tx of [-0.036, -0.012, 0.012, 0.036]) {
        const sep = new THREE.Mesh(new THREE.BoxGeometry(0.004, 0.034, 0.025), lineMat);
        sep.position.x = tx;
        grimaceMouth.add(sep);
      }
      grimaceMouth.visible = false;
      cliente.faceRig.mouthLine.parent.add(grimaceMouth);

      // Expressão 😄 (sorriso aberto feliz e satisfeito) acoplada à boca do cliente
      const happyMouth = new THREE.Group();
      const happyCavity = new THREE.Mesh(
        new THREE.CircleGeometry(0.056, 20, Math.PI, Math.PI),
        new THREE.MeshBasicMaterial({ color: '#4a1818', side: THREE.DoubleSide })
      );
      happyCavity.position.set(0, 0.015, 0.014);
      const happyTeeth = new THREE.Mesh(
        new THREE.PlaneGeometry(0.10, 0.016),
        new THREE.MeshBasicMaterial({ color: '#ffffff' })
      );
      happyTeeth.position.set(0, 0.007, 0.016);
      const happyTongue = new THREE.Mesh(
        new THREE.CircleGeometry(0.028, 14, 0, Math.PI),
        new THREE.MeshBasicMaterial({ color: '#fb7185' })
      );
      happyTongue.position.set(0, -0.026, 0.016);
      happyMouth.add(happyCavity, happyTeeth, happyTongue);
      happyMouth.visible = false;
      cliente.faceRig.mouthLine.parent.add(happyMouth);

      const propCharts = new THREE.Group();
      scene.add(propCharts);

      function makeCloudCluster(scale = 1) {
        const g = new THREE.Group();
        const cloudMat = new THREE.MeshStandardMaterial({ color: '#f8fafc', roughness: 0.55, emissive: '#e2e8f0', emissiveIntensity: 0.18 });
        const puffs = [
          [0, 0, 0, 0.24],
          [-0.20, -0.02, 0.02, 0.18],
          [0.20, -0.02, 0.02, 0.18],
          [-0.10, 0.13, 0.02, 0.17],
          [0.10, 0.13, 0.02, 0.17]
        ];
        for (const [px, py, pz, r] of puffs) {
          const m = new THREE.Mesh(new THREE.SphereGeometry(r * scale, 16, 14), cloudMat);
          m.position.set(px * scale, py * scale, pz * scale);
          m.scale.z = 0.55;
          g.add(m);
        }
        return g;
      }

      function makeQuestionTextPlane() {
        const c = document.createElement('canvas');
        c.width = 512;
        c.height = 256;
        const ctx = c.getContext('2d');
        ctx.clearRect(0, 0, c.width, c.height);
        ctx.font = '900 185px Inter, Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const items = [
          { ch: '?', x: 120, y: 136, rot: -0.14, color: '#ec4899' },
          { ch: '?', x: 256, y: 124, rot: 0, color: '#eab308' },
          { ch: '?', x: 392, y: 136, rot: 0.14, color: '#0284c7' }
        ];
        for (const it of items) {
          ctx.save();
          ctx.translate(it.x, it.y);
          ctx.rotate(it.rot);
          ctx.lineWidth = 14;
          ctx.strokeStyle = '#0f172a';
          ctx.strokeText(it.ch, 0, 0);
          ctx.fillStyle = it.color;
          ctx.fillText(it.ch, 0, 0);
          ctx.restore();
        }
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false });
        return new THREE.Mesh(new THREE.PlaneGeometry(0.46, 0.23), mat);
      }

      // Nuvem esquerda: apenas gráfico de barras
      const cloudLeft = makeCloudCluster(0.84);
      cloudLeft.position.set(-0.36, 2.58, 0.08);
      const barColors = ['#38bdf8', '#f472b6', '#facc15'];
      const barMeshes = [];
      for (let i = 0; i < 3; i++) {
        const bm = new THREE.Mesh(
          new THREE.BoxGeometry(0.072, 0.22, 0.055),
          new THREE.MeshStandardMaterial({ color: barColors[i], emissive: barColors[i], emissiveIntensity: 0.28, roughness: 0.3 })
        );
        bm.position.set(-0.095 + i * 0.095, -0.01, 0.14);
        cloudLeft.add(bm);
        barMeshes.push(bm);
      }
      const dotL1 = new THREE.Mesh(new THREE.SphereGeometry(0.045, 10, 10), new THREE.MeshStandardMaterial({ color: '#f8fafc' }));
      dotL1.position.set(0.18, -0.24, 0.02);
      const dotL2 = new THREE.Mesh(new THREE.SphereGeometry(0.028, 10, 10), new THREE.MeshStandardMaterial({ color: '#f8fafc' }));
      dotL2.position.set(0.26, -0.34, 0.02);
      cloudLeft.add(dotL1, dotL2);
      propCharts.add(cloudLeft);

      // Nuvem direita: apenas quadro com imagem
      const cloudRight = makeCloudCluster(0.84);
      cloudRight.position.set(0.36, 2.58, 0.08);
      const imgFrame = new THREE.Mesh(
        new THREE.BoxGeometry(0.28, 0.20, 0.045),
        new THREE.MeshStandardMaterial({ color: '#1e293b', roughness: 0.4 })
      );
      imgFrame.position.set(0.0, 0.0, 0.14);
      const imgSky = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.16, 0.05), new THREE.MeshBasicMaterial({ color: '#38bdf8' }));
      const imgSun = new THREE.Mesh(new THREE.SphereGeometry(0.028, 10, 10), new THREE.MeshBasicMaterial({ color: '#facc15' }));
      imgSun.position.set(0.055, 0.032, 0.028);
      const imgHill = new THREE.Mesh(new THREE.ConeGeometry(0.072, 0.088, 3), new THREE.MeshBasicMaterial({ color: '#22c55e' }));
      imgHill.position.set(-0.035, -0.028, 0.028);
      imgFrame.add(imgSky, imgSun, imgHill);
      cloudRight.add(imgFrame);
      const dotR1 = new THREE.Mesh(new THREE.SphereGeometry(0.045, 10, 10), new THREE.MeshStandardMaterial({ color: '#f8fafc' }));
      dotR1.position.set(-0.18, -0.24, 0.02);
      const dotR2 = new THREE.Mesh(new THREE.SphereGeometry(0.028, 10, 10), new THREE.MeshStandardMaterial({ color: '#f8fafc' }));
      dotR2.position.set(-0.26, -0.34, 0.02);
      cloudRight.add(dotR1, dotR2);
      propCharts.add(cloudRight);

      // Nuvem topo: interrogações em texto (? ? ?)
      const cloudTop = makeCloudCluster(0.86);
      cloudTop.position.set(0.0, 2.98, -0.02);
      const qTopText = makeQuestionTextPlane();
      qTopText.position.set(0.0, 0.02, 0.14);
      cloudTop.add(qTopText);
      propCharts.add(cloudTop);

      // 4B. Cena 2: Câmera em tripé à frente do personagem, apontada para ele (4.42s - 8.8s)

          // 0s..1.4s: Apenas as 3 nuvens enquadradas; 1.4s..3.0s: câmera desce suave; 3.0s..4.42s: enquadra da cintura pra cima
          const rawP = Math.max(0, Math.min(1, (t - 1.4) / 1.6));
          const easeP = rawP * rawP * (3 - 2 * rawP);
          const camY = 2.86 + (1.32 - 2.86) * easeP;
          const camZ = 2.95 + (2.65 - 2.95) * easeP;

          cliente.joints.forearmR.rotation.set(-1.15 + Math.sin(t * 7) * 0.05, 0, 0);
          cliente.joints.armL.rotation.set(1.25, 0, 0.45);
          cliente.joints.forearmL.rotation.set(-1.15 - Math.sin(t * 7) * 0.05, 0, 0);

          propCameraStress.visible = true;
          bigCam.position.y = 1.48 + Math.sin(dt * 2.5) * 0.015;
          recDot.visible = Math.floor(dt * 3) % 2 === 0;
          timelineBars.forEach((tb) => {
            tb.visible = false;
          });

          const smooth = (x) => {
            const c = Math.max(0, Math.min(1, x));
            return c * c * (3 - 2 * c);
          };

          if (dt < 0.45) {
            // Continua da cena anterior (cintura pra cima)
            camera.position.set(0, 1.32, 2.65);
            camTarget.set(0, 1.24, 0);
          } else if (dt < 1.15) {
            // Vira o enquadramento para a câmera à frente do personagem (mais afastado para caber inteira no 9:16)
            const p = smooth((dt - 0.45) / 0.70);
            const arcX = Math.sin(p * Math.PI) * 1.15;

              1.65 * p + arcX * 0.45,
              1.32 + (1.62 - 1.32) * p,
              2.65 + (0.95 - 2.65) * p
            );

            camTarget.set(0, 1.42, 3.05);

              1.07 + (1.12 - 1.07) * p
            );
            camTarget.set(0, 1.42 + (1.46 - 1.42) * p, 3.05 * (1 - p) + 0.1 * p);
          } else {
            // Plano fechado no rosto
            camera.position.set(0, 1.48, 1.12);
            camTarget.set(0, 1.46, 0.1);
          }
        } else if (t < 11.35) {
          // CENA 3: Print do último frame da cena anterior em um smartphone reproduzindo enquanto a câmera se afasta devagar
          hudTop.style.display = 'none';
          const dt = t - 8.8;
          const p = Math.max(0, Math.min(1, dt / 2.55));
          const easeP = p * p * (3 - 2 * p);

          cliente.root.visible = false;
          animador.root.visible = false;
          propPhone.visible = true;

          // Animação da barra de reprodução do vídeo no celular
          const playProg = 0.25 + 0.65 * p;
          progFill.scale.x = playProg;
          progFill.position.x = -0.38 * (1 - playProg);
          progKnob.position.x = -0.38 + 0.76 * playProg;

          // Leve rotação 3D revelando o corpo do smartphone enquanto afasta devagar
          propPhone.rotation.set(-0.04 * easeP, -0.22 * easeP, 0);
          camera.position.set(0.42 * easeP, 1.5, 1.95 + (3.65 - 1.95) * easeP);
          camTarget.set(0, 1.5, 0);
        } else if (t < 15.95) {
          // CENA 4: Continua do celular da Cena 3 com gráficos simples animados na tela + ícones de engajamento subindo (11.35s - 15.95s)
          hudTop.style.display = 'none';
          const dt = t - 11.35;
          const p = Math.max(0, Math.min(1, dt / 4.60));
          const easeP = p * p * (3 - 2 * p);

          cliente.root.visible = false;
          animador.root.visible = false;
          propPhone.visible = true;
          phoneAnimScreen.visible = true;
          propEngagement.visible = false;

          // Desenha animação simples e dinâmica na tela do celular
          pac.fillStyle = '#0f172a';
          pac.fillRect(0, 0, 270, 480);
          // Card superior: selo de retenção
          pac.fillStyle = '#1e293b';
          pac.fillRect(22, 46, 226, 78);
          pac.fillStyle = '#facc15';
          pac.font = '900 22px sans-serif';
          pac.textAlign = 'center';
          pac.fillText('SIMPLES & RÁPIDO', 135, 80);
          pac.fillStyle = '#38bdf8';
          pac.font = 'bold 17px sans-serif';
          pac.fillText('ATENÇÃO: ' + Math.min(99, Math.floor(78 + p * 21)) + '%', 135, 108);

          // Barras coloridas animadas
          const bCols = ['#38bdf8', '#ec4899', '#facc15', '#22c55e'];
          for (let i = 0; i < 4; i++) {
            const bh = 48 + 85 * Math.abs(Math.sin(dt * 3.2 + i * 0.8));
            pac.fillStyle = bCols[i];
            pac.fillRect(36 + i * 54, 290 - bh, 38, bh);
          }
          // Linha de tendência
          pac.strokeStyle = '#ffffff';
          pac.lineWidth = 4;
          pac.beginPath();
          pac.moveTo(32, 330);
          pac.lineTo(105, 305 + Math.sin(dt * 4) * 10);
          pac.lineTo(175, 275);
          pac.lineTo(238, 230 - Math.abs(Math.cos(dt * 3)) * 20);
          pac.stroke();
          phoneAnimTex.needsUpdate = true;

          // Barra de progresso continua avançando
          const playProg = 0.90 * (1 - p * 0.2) + 0.25 * p;
          progFill.scale.x = Math.min(1, 0.25 + 0.72 * p);
          progFill.position.x = -0.38 * (1 - progFill.scale.x);
          progKnob.position.x = -0.38 + 0.76 * progFill.scale.x;

          // Ícones de engajamento (👀, ⭐, ❤️) subindo flutuando da tela
          engNodes.forEach((em, idx) => {
            const cyc = (dt * 0.45 + em.userData.phase) % 1;
            em.position.set(
              em.userData.laneX + Math.sin(dt * 3 + idx) * 0.10,
              1.15 + cyc * 1.45,
              em.userData.laneZ + cyc * 0.25
            );
            const fade = Math.sin(cyc * Math.PI);
            em.scale.setScalar(0.45 + 0.75 * fade);
            em.material.opacity = Math.min(1, fade * 1.35);
          });

          // Movimento suave de câmera continuando exatamente do fim da Cena 3
          propPhone.rotation.set(-0.04 + 0.01 * easeP, -0.22 + 0.40 * easeP, 0);
          camera.position.set(0.42 - 0.78 * easeP, 1.50 + 0.06 * easeP, 3.65 + 0.20 * easeP);
          camTarget.set(0, 1.50 + 0.04 * easeP, 0);
        } else if (t < 19.15) {
          // CENA 5: Espectadora olha para o celular preocupada, entende com sorriso leve + sobrancelha arqueada, e olha para a câmera
          hudTop.style.display = 'none';
          const dt = t - 15.95;
          const smooth = (x) => {
            const c = Math.max(0, Math.min(1, x));
            return c * c * (3 - 2 * c);
          };

          cliente.root.visible = false;
          animador.root.visible = false;
          espectadora.root.visible = true;
          espectadora.root.position.set(0, 0, 0);
          espectadora.root.rotation.set(0, -0.06, 0);

          // Braços à frente segurando o celular na mão direita
          espectadora.joints.armR.rotation.set(-0.58, 0, 0.22);
          espectadora.joints.forearmR.rotation.set(-1.18, 0, 0);
          espectadora.joints.handR.rotation.set(0.25, 0, 0);
          espectadora.joints.armL.rotation.set(-0.42, 0, -0.18);
          espectadora.joints.forearmL.rotation.set(-0.95, 0, 0);
          propHandPhone.visible = true;
          phoneLight.visible = true;

          const pRelax = smooth((dt - 1.05) / 0.85);
          const pLookCam = smooth((dt - 2.05) / 0.55);

          const browRaise = 0.45 + 0.42 * pRelax;
          const browTilt = -0.75 + 0.85 * pRelax;
          const smile = -0.35 + 0.95 * pRelax;
          const eyeOpen = 0.88 + 0.20 * pRelax;
          const lookY = -0.45 * (1 - pLookCam);

          applyFaceState(espectadora, {
            eyeOpen,
            browRaise,
            browTilt,
            smile,
            mouthOpen: 0,
            look: [0, lookY]
          });

          const headPitch = 0.28 * (1 - 0.35 * pRelax) * (1 - pLookCam) + (pLookCam > 0.8 ? Math.sin((dt - 2.55) * 6) * 0.03 : 0);
          const headYaw = -0.05 * (1 - pLookCam) + 0.08 * pLookCam;
          espectadora.joints.head.rotation.set(headPitch, headYaw, 0.03 * (1 - pRelax));

          camera.position.set(0.32 * (1 - pLookCam * 0.4), 1.46, 2.55 - 0.25 * pLookCam);
          camTarget.set(0, 1.32 + 0.08 * pLookCam, 0.15);
        } else if (t < 22.92) {
          // CENA 6: Personagem principal em pé na frente de um quadro com coisas incompreensíveis, apontando com varinha como professor
          hudTop.style.display = 'none';
          const dt = t - 19.15;
          cliente.root.visible = true;
          animador.root.visible = false;
          cliente.root.position.set(-0.48, 0, 0.35);
          cliente.root.rotation.set(0, 0.25, 0);

          applyFaceState(cliente, {
            eyeOpen: 1.08,
            browRaise: 0.28,
            browTilt: 0.05,
            smile: 0.55,
            mouthOpen: 0.14 * Math.abs(Math.sin(dt * 9))
          });
          cliente.joints.head.rotation.set(0.02, Math.sin(dt * 2.2) * 0.16, 0);

          // Braço esquerdo estendido apontando a varinha para o quadro
          cliente.joints.armL.rotation.set(-0.85, 0, 0.68 + Math.sin(dt * 3.5) * 0.10);
          cliente.joints.forearmL.rotation.set(-0.35, 0, 0);
          // Braço direito gesticulando enquanto explica
          cliente.joints.armR.rotation.set(-0.42, 0, -0.25);
          cliente.joints.forearmR.rotation.set(-0.85 + Math.sin(dt * 4.2) * 0.14, 0, 0);

          propChalkboard.visible = true;
          pointerStick.visible = true;

          camera.position.set(0.0, 1.38, 3.65);
          camTarget.set(-0.02, 1.28, 0);
        } else if (t < 26.85) {
          // CENA 7: Personagem do lado direito com varinha apontando para tela de computador à esquerda com site de promoção
          hudTop.style.display = 'none';
          const dt = t - 22.92;
          cliente.root.visible = true;
          animador.root.visible = false;
          cliente.root.position.set(0.50, 0, 0.35);
          cliente.root.rotation.set(0, -0.26, 0);

          applyFaceState(cliente, {
            eyeOpen: 1.08,
            browRaise: 0.28,
            browTilt: 0.05,
            smile: 0.58,
            mouthOpen: 0.14 * Math.abs(Math.sin(dt * 9))
          });
          cliente.joints.head.rotation.set(0.02, Math.sin(dt * 2.2) * 0.16, 0);

          // Braço direito estendido apontando a varinha para o monitor à esquerda
          cliente.joints.armR.rotation.set(-0.85, 0, -0.68 - Math.sin(dt * 3.5) * 0.10);
          cliente.joints.forearmR.rotation.set(-0.35, 0, 0);
          // Braço esquerdo gesticulando enquanto explica
          cliente.joints.armL.rotation.set(-0.42, 0, 0.25);
          cliente.joints.forearmL.rotation.set(-0.85 + Math.sin(dt * 4.2) * 0.14, 0, 0);

          propMonitor.visible = true;
          pointerStickR.visible = true;

          camera.position.set(0.0, 1.38, 3.65);
          camTarget.set(0.02, 1.28, 0);
        } else if (t < 30.06) {
          // CENA 8: Comparar produto com a concorrência (personagem principal olhando para a coroa subindo)
          const dt = t - 26.85;
          hudPill.textContent = "CASO DE USO 03";
          hudTitle.textContent = "Compare & Destaque";
          cliente.root.visible = true;
          animador.root.visible = false;
          cliente.root.position.set(0, 0, -0.1);
          cliente.root.rotation.set(0, 0.22, 0);

          const grow = Math.min(1, dt / 0.85);
          const easeGrow = grow * grow * (3 - 2 * grow);

          applyFaceState(cliente, {
            eyeOpen: 1.15,
            browRaise: 0.25 + 0.45 * easeGrow,
            smile: 0.65 + 0.25 * easeGrow,
            look: [0.55, -0.15 + 0.55 * easeGrow]
          });
          // Cabeça acompanha a coroa subindo na barra verde à direita
          cliente.joints.head.rotation.set(0.22 - 0.50 * easeGrow, 0.42, 0);
          cliente.joints.armL.rotation.set(-0.95, 0, 0.55);
          cliente.joints.forearmL.rotation.set(-0.35, 0, 0);
          cliente.joints.armR.rotation.set(-0.35, 0, -0.25);

          propCompare.visible = true;
          compBarGood.scale.y = 0.2 + 0.8 * easeGrow;
          compBarGood.position.y = compBarGood.scale.y * 0.92;
          crown.position.y = compBarGood.scale.y * 1.85 + 0.22;
          crown.rotation.y = dt * 2.0;

          const zoomP = Math.min(1, dt / 3.21);
          const easeZoom = zoomP * zoomP * (3 - 2 * zoomP);
          camera.position.set(0.32 * easeZoom, 1.55 - 0.07 * easeZoom, 5.8 - 1.35 * easeZoom);
          camTarget.set(0.32 * easeZoom, 1.1 + 0.14 * easeZoom, 0.05 * easeZoom);
        } else if (t < 33.85) {
          // CENA 9: Apenas o personagem principal em cena com uma lâmpada acendendo acima de sua cabeça (30.06s - 33.85s)
          hudTop.style.display = 'none';
          const dt = t - 30.06;
          const smooth = (x) => {
            const c = Math.max(0, Math.min(1, x));
            return c * c * (3 - 2 * c);
          };
          const pLit = smooth((dt - 0.45) / 0.35);
          const pLogo = smooth((dt - 2.14) / 0.35);

          cliente.root.visible = true;
          animador.root.visible = false;
          cliente.root.position.set(0, 0, 0);
          cliente.root.rotation.set(0, 0.04, 0);

          applyFaceState(cliente, {
            eyeOpen: 1.0 + 0.16 * pLit,
            browRaise: 0.25 + 0.45 * pLit,
            smile: 0.35 + 0.55 * pLit
          });
          cliente.joints.head.rotation.set(0.06 * (1 - pLit) - 0.04 * pLit, 0, 0);
          cliente.joints.armR.rotation.set(-0.45 - 0.95 * pLit, 0, -0.25);
          cliente.joints.forearmR.rotation.set(-0.65 - 0.35 * pLit, 0, 0);
          cliente.joints.armL.rotation.set(-0.20 - 0.55 * pLogo, 0, 0.18 + 0.25 * pLogo);
          cliente.joints.forearmL.rotation.set(-0.35 - 0.35 * pLogo, 0, 0);

          propIdea.visible = true;
          propIdea.position.x = 0;
          bulbLight.visible = pLit > 0.05;
          bulbLight.intensity = 1.4 * pLit;
          bulbMat.color.set(pLit > 0.2 ? '#fef08a' : '#94a3b8');
          bulbMat.emissiveIntensity = 1.8 * pLit;
          bulbRays.visible = pLit > 0.05;
          bulbRays.scale.setScalar(0.5 + 0.5 * pLit + (pLit > 0.8 ? Math.sin(dt * 8) * 0.05 : 0));
          bulbRays.rotation.z = dt * 0.8;

          if (pLogo > 0.01) {
            labLogoOverlay.style.display = 'flex';
            labLogoOverlay.style.backdropFilter = `blur(${(18 * pLogo).toFixed(1)}px)`;
            labLogoOverlay.style.webkitBackdropFilter = `blur(${(18 * pLogo).toFixed(1)}px)`;
            labLogoOverlay.style.background = `rgba(7, 11, 22, ${(0.38 * pLogo).toFixed(2)})`;
            labLogoImg.style.opacity = pLogo.toFixed(3);
            labLogoImg.style.transform = `scale(${(0.75 + 0.25 * pLogo).toFixed(3)})`;
          }

          camera.position.set(0, 1.48 - 0.04 * pLogo, 3.25 + 0.70 * pLogo);
          camTarget.set(0, 1.42, 0);
        } else if (t < 37.90) {
          // CENA 10: Lâmpada 💡 sobe -> Relógio 24h (2 voltas) atrás -> Fumaça -> Quadrado preto com Play (33.85s - 37.90s)
          hudTop.style.display = 'none';
          const dt = t - 33.85;
          const smooth = (x) => {
            const c = Math.max(0, Math.min(1, x));
            return c * c * (3 - 2 * c);
          };

          cliente.root.visible = true;
          animador.root.visible = false;
          cliente.root.position.set(-0.22, 0, 0.1);
          cliente.root.rotation.set(0, 0.12, 0);

          // Braço direito segurando o celular
          cliente.joints.armR.rotation.set(-0.55, 0, 0.20);
          cliente.joints.forearmR.rotation.set(-1.12, 0, 0);
          cliente.joints.handR.rotation.set(0.22, 0, 0);
          cliente.joints.armL.rotation.set(-0.25, 0, 0.18);
          cliente.joints.forearmL.rotation.set(-0.45, 0, 0);

          propFlow10.visible = true;
          propHandPhone10.visible = true;

          // 1) 0..1.05s: Lâmpada 💡 sai do celular e sobe até o alto (sempre à frente do personagem)
          const pRise = smooth((dt - 0.10) / 0.95);
          const vanished = dt >= 2.72;
          msgBubble.visible = !vanished;
          msgBubble.position.set(-0.15 + 0.15 * pRise, 1.15 + 0.87 * pRise, 0.52 + 0.04 * pRise);
          msgBubble.scale.setScalar(0.55 + 0.45 * pRise);

          // 2) 1.00..2.45s: Relógio aparece atrás da lâmpada e dá 2 voltas rápidas (24h)
          const pClockIn = smooth((dt - 1.00) / 0.25);
          const pSpin = Math.max(0, Math.min(1, (dt - 1.15) / 1.30));
          clockGroup.visible = dt >= 1.00 && !vanished;
          clockGroup.scale.setScalar(0.25 + 0.75 * pClockIn);
          clockHourHand.rotation.z = -pSpin * Math.PI * 4;
          clockMinHand.rotation.z = -pSpin * Math.PI * 16;

          // 3) 2.45..3.15s: Tudo vira fumaça e some
          const pSmoke = Math.max(0, Math.min(1, (dt - 2.45) / 0.70));
          smokeGroup.visible = dt >= 2.45 && dt < 3.20;
          smokeMat.opacity = Math.sin(pSmoke * Math.PI) * 0.92;
          smokePuffs.forEach((puff, idx) => {
            const [dx, dy, dz] = puff.userData.dir;
            const spread = 0.08 + pSmoke * 0.48;
            puff.position.set(dx * spread, dy * spread, dz * spread);
            puff.scale.setScalar(0.6 + Math.sin(pSmoke * Math.PI) * 0.85 + (idx % 2) * 0.15);
          });

          // 4) 2.72..4.05s: Surge o quadrado preto com ícone de Play (vídeo pronto)
          const pPlay = smooth((dt - 2.72) / 0.40);
          readyVideoCard.visible = dt >= 2.72;
          readyVideoCard.scale.setScalar(0.15 + 0.85 * pPlay);
          readyVideoCard.position.y = 2.02 + Math.sin(dt * 3.5) * 0.02;

          applyFaceState(cliente, {
            eyeOpen: 1.05 + 0.1 * pPlay,
            browRaise: 0.25 + 0.45 * pPlay,
            smile: 0.45 + 0.50 * pPlay,
            look: [0.05, 0.35 * pRise]
          });
          cliente.joints.head.rotation.set(0.15 * (1 - pRise) - 0.12 * pRise, 0.08, 0);

          const zoomP = Math.min(1, dt / 4.05);
          const easeZoom = zoomP * zoomP * (3 - 2 * zoomP);
          camera.position.set(0, 1.50 + 0.16 * easeZoom, 3.65 - 0.55 * easeZoom);
          camTarget.set(0, 1.54 + 0.22 * easeZoom, 0.05);
        } else if (t < 40.70) {
          // CENA 11: Continua do plano anterior, fecha bem no rosto com expressão feliz e satisfeita 😄 (37.90s - 40.70s)
          hudTop.style.display = 'none';
          const dt = t - 37.90;
          const smooth = (x) => {
            const c = Math.max(0, Math.min(1, x));
            return c * c * (3 - 2 * c);
          };
          const pZoom = smooth(dt / 1.10);

          cliente.root.visible = true;
          animador.root.visible = false;
          cliente.root.position.set(-0.22, 0, 0.1);
          cliente.root.rotation.set(0, 0.12 * (1 - pZoom), 0);

          // Mantém o quadrado preto do vídeo no alto enquanto a câmera fecha no rosto
          propFlow10.visible = pZoom < 0.7;
          propHandPhone10.visible = true;
          msgBubble.visible = false;
          clockGroup.visible = false;
          smokeGroup.visible = false;
          readyVideoCard.visible = pZoom < 0.7;
          readyVideoCard.scale.setScalar(1);
          readyVideoCard.position.y = 2.02;

          cliente.joints.armR.rotation.set(-0.55 + 0.25 * pZoom, 0, 0.20);
          cliente.joints.forearmR.rotation.set(-1.12 + 0.35 * pZoom, 0, 0);
          cliente.joints.armL.rotation.set(-0.25, 0, 0.18);
          cliente.joints.forearmL.rotation.set(-0.45, 0, 0);

          // Expressão 😄: olhos felizes arqueados + sobrancelhas erguidas + sorriso aberto
          applyFaceState(cliente, {
            eyeOpen: 0.72,
            browRaise: 0.55,
            browTilt: 0.15,
            smile: 0,
            mouthOpen: 0,
            look: [0, 0.25 * (1 - pZoom)]
          });
          cliente.faceRig.mouthLine.visible = false;
          cliente.faceRig.mouthArc.visible = false;
          cliente.faceRig.mouthOpen.visible = false;
          happyMouth.visible = true;

          cliente.joints.head.rotation.set(
            -0.12 * (1 - pZoom) + Math.sin(dt * 4) * 0.03,
            0.08 * (1 - pZoom),
            0
          );

          // Fecha bem no rosto continuando exatamente de (0, 1.66, 3.10) -> (-0.22, 1.48, 1.24)
          camera.position.set(
            -0.22 * pZoom,
            1.66 + (1.48 - 1.66) * pZoom,
            3.10 + (1.24 - 3.10) * pZoom
          );
          camTarget.set(
            -0.22 * pZoom,
            1.76 + (1.46 - 1.76) * pZoom,
            0.05 + (0.10 - 0.05) * pZoom
          );
        } else {
          // CENA 12: Continua do plano fechado anterior, desfoca o fundo e exibe logo da Labscript + botão "Fale com a Lab" (40.70s - 44.2s)
          hudTop.style.display = 'none';
          const dt = t - 40.70;
          const smooth = (x) => {
            const c = Math.max(0, Math.min(1, x));
            return c * c * (3 - 2 * c);
          };
          const pIn = smooth(dt / 0.45);
          const pBtn = smooth((dt - 0.25) / 0.40);

          cliente.root.visible = true;
          animador.root.visible = false;
          cliente.root.position.set(-0.22, 0, 0.1);
          cliente.root.rotation.set(0, 0, 0);

          applyFaceState(cliente, {
            eyeOpen: 0.72,
            browRaise: 0.55,
            browTilt: 0.15,
            smile: 0,
            mouthOpen: 0,
            look: [0, 0]
          });
          cliente.faceRig.mouthLine.visible = false;
          cliente.faceRig.mouthArc.visible = false;
          cliente.faceRig.mouthOpen.visible = false;
          happyMouth.visible = true;
          cliente.joints.head.rotation.set(Math.sin(dt * 4) * 0.025, 0, 0);

          camera.position.set(-0.22, 1.48, 1.24);
          camTarget.set(-0.22, 1.46, 0.10);

          labLogoOverlay.style.display = 'flex';
          labLogoOverlay.style.backdropFilter = `blur(${(20 * pIn).toFixed(1)}px)`;
          labLogoOverlay.style.webkitBackdropFilter = `blur(${(20 * pIn).toFixed(1)}px)`;
          labLogoOverlay.style.background = `rgba(7, 11, 22, ${(0.45 * pIn).toFixed(2)})`;
          labLogoImg.style.opacity = pIn.toFixed(3);
          labLogoImg.style.transform = `scale(${(0.75 + 0.25 * pIn).toFixed(3)})`;

          ctaBtn.style.display = 'block';
          ctaBtn.style.opacity = pBtn.toFixed(3);
          ctaBtn.style.transform = `translateY(${(24 * (1 - pBtn)).toFixed(1)}px) scale(${(0.88 + 0.12 * pBtn).toFixed(3)})`;
        }
      }

      function loop() {
        applyDeterministicScene(tl.time());
        camera.lookAt(camTarget);
        renderer.render(scene, camera);
        requestAnimationFrame(loop);
      }
      loop();
    </script>
  </body>
</html>
