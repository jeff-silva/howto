<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Treta no Futebol - HyperFrames 3D</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Teko:wght@700&family=Montserrat:wght@800;900&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>

    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js",
          "three/addons/": "./node_modules/three/examples/jsm/"
        }
      }
    </script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0d131a;
        font-family: "Montserrat", sans-serif;
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }

      #tela3d {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        z-index: 1;
      }

      /* Flash de transição entre cenas */
      .flash-fx {
        position: absolute;
        inset: 0;
        z-index: 15;
        background: #ffffff;
        opacity: 0;
        pointer-events: none;
      }

      /* Vinheta cinematográfica */
      .vinheta {
        position: absolute;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        background: radial-gradient(circle at 50% 50%, transparent 60%, rgba(0, 0, 0, 0.7) 100%);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1080"
      data-height="1920"
    >
      <canvas id="tela3d" data-start="0" data-track-index="0"></canvas>
      <div class="vinheta"></div>
      <div class="flash-fx" data-start="0" data-track-index="1"></div>
    </div>

    <script type="module">
      import * as THREE from 'three';
      import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
      import { makeCharacter, applyFaceState } from './3d/characters/makeCharacter.js';

      // ==========================================
      // 1. SETUP DO THREE.JS NO CANVAS ÚNICO
      // ==========================================
      const canvas = document.getElementById('tela3d');
      const W = 1080;
      const H = 1920;

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#0a160d');
      scene.fog = new THREE.FogExp2('#0a160d', 0.025);

      const camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 100);
      const camTarget = new THREE.Vector3(0, 0.45, 0);

      // Iluminação de estádio noturno
      const hemiLight = new THREE.HemisphereLight('#c4e2ff', '#1f3d23', 0.85);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight('#ffffff', 2.8);
      dirLight.position.set(4, 10, 6);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 1024;
      dirLight.shadow.mapSize.height = 1024;
      scene.add(dirLight);

      const backlight = new THREE.DirectionalLight('#38bdf8', 1.8);
      backlight.position.set(-4, 5, -5);
      scene.add(backlight);

      // ==========================================
      // 2. ELEMENTOS DO ESTÁDIO
      // ==========================================
      const gramaGeo = new THREE.PlaneGeometry(120, 120);
      const gramaMat = new THREE.MeshStandardMaterial({
        color: '#246b29',
        roughness: 0.9,
        flatShading: true
      });
      const grama = new THREE.Mesh(gramaGeo, gramaMat);
      grama.rotation.x = -Math.PI / 2;
      grama.receiveShadow = true;
      scene.add(grama);

      const linhaGeo = new THREE.PlaneGeometry(0.14, 30);
      const linhaMat = new THREE.MeshBasicMaterial({ color: '#ffffff' });
      const linha = new THREE.Mesh(linhaGeo, linhaMat);
      linha.rotation.x = -Math.PI / 2;
      linha.position.set(0.6, 0.005, 0);
      scene.add(linha);

      const bola = new THREE.Mesh(
        new THREE.SphereGeometry(0.14, 12, 10),
        new THREE.MeshStandardMaterial({ color: '#f8fafc', roughness: 0.3 })
      );
      bola.castShadow = true;
      bola.position.set(0.6, 0.14, 0);
      scene.add(bola);

      const arquibancada = new THREE.Group();
      for (let i = 0; i < 6; i++) {
        const degrau = new THREE.Mesh(
          new THREE.BoxGeometry(50, 1.3, 2.2),
          new THREE.MeshStandardMaterial({ color: i % 2 === 0 ? '#1e293b' : '#334155' })
        );
        degrau.position.set(0, i * 1.1 + 0.5, -11 - i * 2.0);
        arquibancada.add(degrau);
      }
      scene.add(arquibancada);

      // ==========================================
      // 3. PERSONAGENS (CENA 1 & 2): MULHERES & JUIZ
      // ==========================================
      function addSaltoAlto(char, cor) {
        for (const side of ['footL', 'footR']) {
          const salto = new THREE.Mesh(
            new THREE.CylinderGeometry(0.015, 0.01, 0.09, 6),
            new THREE.MeshStandardMaterial({ color: cor, roughness: 0.3 })
          );
          salto.position.set(0, -0.045, -0.07);
          char.joints[side].add(salto);
        }
      }

      // Mulher 1: Vítima (Vestido Preto Curto)
      const vitima = makeCharacter({
        name: 'vitima',
        skin: '#f3cfae',
        height: 0.96,
        build: 0.88,
        top: { color: '#09090b', sleeves: 'short' },
        bottom: { color: '#09090b', type: 'skirt' },
        shoes: '#09090b',
        hair: { style: 'long', color: '#c2410c' }
      });
      addSaltoAlto(vitima, '#000000');
      vitima.root.position.set(0.6, 0, 0);
      vitima.root.rotation.y = Math.PI / 2;
      scene.add(vitima.root);

      // Mulher 2: Infratora do Carrinho (Vestido Vermelho Curto e Salto Alto)
      const atacante = makeCharacter({
        name: 'atacante',
        skin: '#e0ac69',
        height: 0.98,
        build: 0.92,
        top: { color: '#dc2626', sleeves: 'short' },
        bottom: { color: '#dc2626', type: 'skirt' },
        shoes: '#dc2626',
        hair: { style: 'ponytail', color: '#171717' }
      });
      addSaltoAlto(atacante, '#991b1b');
      atacante.root.position.set(-3.5, 0, 0);
      atacante.root.rotation.y = Math.PI / 2;
      scene.add(atacante.root);

      // Juiz de Futebol (Careca, All-Black)
      const juiz = makeCharacter({
        name: 'juiz',
        skin: '#381e0f',
        height: 1.06,
        build: 1.05,
        top: { color: '#18181b', sleeves: 'short' },
        bottom: { color: '#18181b', type: 'shorts' },
        shoes: '#09090b',
        hair: { style: 'bald' }
      });
      const escudoFifa = new THREE.Mesh(
        new THREE.BoxGeometry(0.06, 0.075, 0.01),
        new THREE.MeshStandardMaterial({ color: '#2563eb', roughness: 0.3 })
      );
      escudoFifa.position.set(0.12, 0.18, 0.14);
      juiz.joints.chest.add(escudoFifa);

      const apitoGroup = new THREE.Group();
      const apitoCorpo = new THREE.Mesh(
        new THREE.CylinderGeometry(0.015, 0.018, 0.06, 8),
        new THREE.MeshStandardMaterial({ color: '#d1d5db', metalness: 0.8, roughness: 0.2 })
      );
      apitoCorpo.rotation.x = Math.PI / 2;
      apitoGroup.add(apitoCorpo);
      apitoGroup.position.set(0, 0.08, 0.24);
      juiz.joints.head.add(apitoGroup);

      const cartaoVermelho = new THREE.Mesh(
        new THREE.BoxGeometry(0.09, 0.14, 0.004),
        new THREE.MeshStandardMaterial({
          color: '#ef4444',
          roughness: 0.2,
          emissive: '#dc2626',
          emissiveIntensity: 0.3
        })
      );
      cartaoVermelho.position.set(0, -0.08, 0);
      cartaoVermelho.rotation.x = Math.PI / 2;
      cartaoVermelho.visible = false;
      juiz.joints.handR.add(cartaoVermelho);

      juiz.root.position.set(0, 0, 5.0);
      juiz.root.visible = false;
      scene.add(juiz.root);

      // ==========================================
      // 3.5 RETARGETING MIXAMO FBX -> SKELETON.JS (JUIZ)
      // ==========================================
      const MIXAMO_TO_JOINT = [
        ['hips', 'mixamorigHips'],
        ['spine', 'mixamorigSpine'],
        ['chest', 'mixamorigSpine2'],
        ['neck', 'mixamorigNeck'],
        ['head', 'mixamorigHead'],
        ['armL', 'mixamorigLeftArm'],
        ['forearmL', 'mixamorigLeftForeArm'],
        ['handL', 'mixamorigLeftHand'],
        ['legL', 'mixamorigLeftUpLeg'],
        ['shinL', 'mixamorigLeftLeg'],
        ['footL', 'mixamorigLeftFoot'],
        ['legR', 'mixamorigRightUpLeg'],
        ['shinR', 'mixamorigRightLeg'],
        ['footR', 'mixamorigRightFoot'],
      ];

      let juizFbxRoot = null;
      let juizCapoeiraMixer = null;
      let juizCapoeiraDuration = 3.4;
      const mixamoBones = {};
      const restWorldQuatInv = {};
      let restHipsY = 100;

      const _qSrc = new THREE.Quaternion();
      const _qParent = new THREE.Quaternion();
      const _qTarget = new THREE.Quaternion();
      const _vHips = new THREE.Vector3();

      function applyMixamoToCharacter(character) {
        if (!juizFbxRoot) return;
        juizFbxRoot.updateMatrixWorld(true);
        character.root.updateMatrixWorld(true);

        const hipsBone = mixamoBones['mixamorigHips'];
        if (hipsBone) {
          hipsBone.getWorldPosition(_vHips);
          const scale = 0.68 / (restHipsY || 100);
          character.joints.hips.position.set(_vHips.x * scale, _vHips.y * scale, _vHips.z * scale);
        }

        for (const [jointName, mixamoName] of MIXAMO_TO_JOINT) {
          const srcBone = mixamoBones[mixamoName];
          const tgtJoint = character.joints[jointName];
          const restInv = restWorldQuatInv[mixamoName];
          if (!srcBone || !tgtJoint || !restInv) continue;

          srcBone.getWorldQuaternion(_qSrc);
          _qTarget.copy(_qSrc).multiply(restInv);

          tgtJoint.parent.getWorldQuaternion(_qParent);
          tgtJoint.quaternion.copy(_qParent).invert().multiply(_qTarget);
          tgtJoint.updateMatrixWorld(false);
        }
      }

      // Carrega a animação Mixamo (capoeira.fbx) para aplicar ao juiz (retargeting)
      const fbxLoader = new FBXLoader();
      fbxLoader.load('./assets/animations/capoeira.fbx', (fbx) => {
        juizFbxRoot = fbx;
        juizFbxRoot.visible = false;
        scene.add(juizFbxRoot);

        juizFbxRoot.updateMatrixWorld(true);
        juizFbxRoot.traverse((child) => {
          if (child.isBone || child.name.startsWith('mixamorig')) {
            mixamoBones[child.name.replace(':', '')] = child;
          }
        });

        for (const [, mixamoName] of MIXAMO_TO_JOINT) {
          const b = mixamoBones[mixamoName];
          if (b) {
            restWorldQuatInv[mixamoName] = b.getWorldQuaternion(new THREE.Quaternion()).invert();
          }
        }
        if (mixamoBones['mixamorigHips']) {
          const p = mixamoBones['mixamorigHips'].getWorldPosition(new THREE.Vector3());
          if (p.y > 1) restHipsY = p.y;
        }

        if (fbx.animations && fbx.animations.length > 0) {
          const clip = fbx.animations[0];
          juizCapoeiraDuration = clip.duration || 3.4;
          juizCapoeiraMixer = new THREE.AnimationMixer(juizFbxRoot);
          const act = juizCapoeiraMixer.clipAction(clip);
          act.setLoop(THREE.LoopRepeat);
          act.play();
        }
      });

      // ==========================================
      // 4. TIMELINE GSAP (CENA 1 + CENA 2)
      // ==========================================
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ------------------------------------------
      // CENA 1: 0.0s a 5.0s (CARRINHO EM PERFIL)
      // ------------------------------------------
      tl.set(camera.position, { x: 0, y: 1.05, z: 7.2 }, 0);
      tl.call(() => {
        camTarget.set(0, 0.45, 0);
        juiz.root.visible = false;
        vitima.root.visible = true;
        atacante.root.visible = true;

        vitima.root.rotation.set(0, Math.PI / 2, 0);
        vitima.root.position.set(0.6, 0, 0);

        atacante.root.rotation.set(0, Math.PI / 2, 0);
        atacante.root.position.set(-3.5, 0, 0);
      }, null, 0);

      tl.to(bola.position, { x: 1.3, z: 0, duration: 1.8, ease: "power1.out" }, 0);
      tl.to(vitima.joints.legL.rotation, { x: -0.5, duration: 0.35, repeat: 4, yoyo: true }, 0);
      tl.to(vitima.joints.legR.rotation, { x: 0.5, duration: 0.35, repeat: 4, yoyo: true }, 0);

      tl.to(atacante.root.position, { x: -1.8, duration: 1.1, ease: "power1.in" }, 0);
      tl.to(atacante.joints.legL.rotation, { x: -0.8, duration: 0.22, repeat: 5, yoyo: true }, 0);
      tl.to(atacante.joints.legR.rotation, { x: 0.8, duration: 0.22, repeat: 5, yoyo: true }, 0);

      // O Carrinho
      tl.to(atacante.root.position, { y: 0.18, duration: 0.35, ease: "power2.in" }, 1.1);
      tl.to(atacante.root.rotation, { z: -1.35, x: -0.15, y: Math.PI / 2 + 0.15, duration: 0.35, ease: "power2.out" }, 1.1);
      tl.to(atacante.joints.legR.rotation, { x: -1.55, z: -0.2, duration: 0.35, ease: "power2.out" }, 1.1);
      tl.to(atacante.joints.shinR.rotation, { x: 0, duration: 0.35 }, 1.1);
      tl.to(atacante.joints.legL.rotation, { x: 0.85, z: 0.35, duration: 0.35, ease: "power2.out" }, 1.1);
      tl.to(atacante.joints.shinL.rotation, { x: -1.4, duration: 0.35 }, 1.1);
      tl.to(atacante.joints.armL.rotation, { x: 1.1, z: 0.8, duration: 0.35 }, 1.1);
      tl.to(atacante.joints.armR.rotation, { x: -0.5, z: -0.6, duration: 0.35 }, 1.1);

      tl.to(atacante.root.position, { x: 0.5, duration: 0.85, ease: "power2.out" }, 1.25);

      // Impacto
      tl.to(vitima.root.position, { x: 1.9, y: 0.95, duration: 0.6, ease: "power2.out" }, 1.95);
      tl.to(vitima.root.rotation, { z: 2.1, x: 0.7, duration: 0.7, ease: "power2.out" }, 1.95);
      tl.to(vitima.joints.legL.rotation, { x: 1.2, z: 0.5, duration: 0.5 }, 1.95);
      tl.to(vitima.joints.legR.rotation, { x: -1.0, z: -0.4, duration: 0.5 }, 1.95);
      tl.to(vitima.root.position, { y: 0.18, duration: 0.5, ease: "bounce.out" }, 2.55);

      tl.to(bola.position, { x: 4.8, y: 0.9, z: -1.5, duration: 1.4, ease: "power2.out" }, 1.95);
      tl.to(camera.position, { x: "+=0.06", y: "+=0.05", duration: 0.05, repeat: 5, yoyo: true }, 1.95);

      // Transição Flash 1
      tl.to(".flash-fx", { opacity: 1, duration: 0.15 }, 4.85);
      tl.to(".flash-fx", { opacity: 0, duration: 0.25 }, 5.0);

      // ------------------------------------------
      // CENA 2: 5.0s a 10.0s (JUIZ EXECUTANDO CAPOEIRA COM CARTÃO VERMELHO LEVANTADO)
      // ------------------------------------------
      tl.set(vitima.root, { visible: false }, 5.0);
      tl.set(atacante.root, { visible: false }, 5.0);
      tl.set(juiz.root, { visible: true }, 5.0);
      tl.set(juiz.root.position, { x: 0, y: 0, z: 0 }, 5.0);
      tl.set(apitoGroup, { visible: false }, 5.0);
      tl.set(cartaoVermelho, { visible: true }, 5.0);
      tl.set(juiz.joints.armR.rotation, { x: 2.75, y: 0.05, z: 0.12 }, 5.0);
      tl.set(juiz.joints.forearmR.rotation, { x: 0.15, y: 0, z: 0 }, 5.0);
      tl.set(juiz.joints.handR.rotation, { x: 0, y: 0, z: 0 }, 5.0);
      tl.set(camTarget, { x: -0.1, y: 1.05, z: 0 }, 5.0);

      tl.call(() => {
        applyFaceState(juiz, {
          eyeOpen: 1.15,
          browRaise: 0.2,
          browTilt: 0.2,
          smile: 0.7,
          mouthOpen: 0.1
        });
      }, null, 5.0);

      tl.fromTo(camera.position,
        { x: -0.35, y: 1.35, z: 5.1 },
        { x: 0.15, y: 1.3, z: 4.6, duration: 4.8, ease: "power1.inOut", immediateRender: false },
        5.0
      );

      const juizCapoeiraState = { t: 0 };
      tl.fromTo(juizCapoeiraState,
        { t: 0 },
        {
          t: 5.0,
          duration: 5.0,
          ease: "none",
          onUpdate: () => {
            if (juizCapoeiraMixer) {
              juizCapoeiraMixer.setTime(juizCapoeiraState.t % juizCapoeiraDuration);
              applyMixamoToCharacter(juiz);
            }
          }
        },
        5.0
      );

      // Registra a timeline no HyperFrames
      window.__timelines["main"] = tl;
      tl.seek(0);

      // Loop do Three.js
      function loop() {
        camera.lookAt(camTarget);
        renderer.render(scene, camera);
        requestAnimationFrame(loop);
      }
      loop();
    </script>
  </body>
</html>
