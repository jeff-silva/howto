<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Treta no Futebol - HyperFrames 3D</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Teko:wght@700&family=Montserrat:wght@800;900&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>

    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js",
          "three/addons/": "./node_modules/three/examples/jsm/"
        }
      }
    </script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0d131a;
        font-family: "Montserrat", sans-serif;
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }

      #tela3d {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        z-index: 1;
      }

      /* Flash de transição entre cenas */
      .flash-fx {
        position: absolute;
        inset: 0;
        z-index: 15;
        background: #ffffff;
        opacity: 0;
        pointer-events: none;
      }

      /* Vinheta cinematográfica */
      .vinheta {
        position: absolute;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        background: radial-gradient(circle at 50% 50%, transparent 60%, rgba(0, 0, 0, 0.7) 100%);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="13.1"
      data-width="1080"
      data-height="1920"
    >
      <canvas id="tela3d" data-start="0" data-track-index="0"></canvas>
      <div class="vinheta"></div>
      <div class="flash-fx" data-start="0" data-track-index="1"></div>
    </div>

    <script type="module">
      import * as THREE from 'three';
      import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
      import { makeCharacter, applyFaceState } from './3d/characters/makeCharacter.js';

      // ==========================================
      // 1. SETUP DO THREE.JS NO CANVAS ÚNICO
      // ==========================================
      const canvas = document.getElementById('tela3d');
      const W = 1080;
      const H = 1920;

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#0a160d');
      scene.fog = new THREE.FogExp2('#0a160d', 0.025);

      const camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 100);
      const camTarget = new THREE.Vector3(0, 0.45, 0);

      // Iluminação de estádio noturno
      const hemiLight = new THREE.HemisphereLight('#c4e2ff', '#1f3d23', 0.85);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight('#ffffff', 2.8);
      dirLight.position.set(4, 10, 6);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 1024;
      dirLight.shadow.mapSize.height = 1024;
      scene.add(dirLight);

      const backlight = new THREE.DirectionalLight('#38bdf8', 1.8);
      backlight.position.set(-4, 5, -5);
      scene.add(backlight);

      // ==========================================
      // 2. ELEMENTOS DO ESTÁDIO
      // ==========================================
      const gramaGeo = new THREE.PlaneGeometry(120, 120);
      const gramaMat = new THREE.MeshStandardMaterial({
        color: '#246b29',
        roughness: 0.9,
        flatShading: true
      });
      const grama = new THREE.Mesh(gramaGeo, gramaMat);
      grama.rotation.x = -Math.PI / 2;
      grama.receiveShadow = true;
      scene.add(grama);

      const linhaGeo = new THREE.PlaneGeometry(0.14, 30);
      const linhaMat = new THREE.MeshBasicMaterial({ color: '#ffffff' });
      const linha = new THREE.Mesh(linhaGeo, linhaMat);
      linha.rotation.x = -Math.PI / 2;
      linha.position.set(0.6, 0.005, 0);
      scene.add(linha);

      const bola = new THREE.Mesh(
        new THREE.SphereGeometry(0.14, 12, 10),
        new THREE.MeshStandardMaterial({ color: '#f8fafc', roughness: 0.3 })
      );
      bola.castShadow = true;
      bola.position.set(0.6, 0.14, 0);
      scene.add(bola);

      const arquibancada = new THREE.Group();
      for (let i = 0; i < 6; i++) {
        const degrau = new THREE.Mesh(
          new THREE.BoxGeometry(50, 1.3, 2.2),
          new THREE.MeshStandardMaterial({ color: i % 2 === 0 ? '#1e293b' : '#334155' })
        );
        degrau.position.set(0, i * 1.1 + 0.5, -11 - i * 2.0);
        arquibancada.add(degrau);
      }
      scene.add(arquibancada);

      // ==========================================
      // 3. PERSONAGENS (CENA 1 & 2): MULHERES & JUIZ
      // ==========================================
      function addSaltoAlto(char, cor) {
        for (const side of ['footL', 'footR']) {
          const salto = new THREE.Mesh(
            new THREE.CylinderGeometry(0.015, 0.01, 0.09, 6),
            new THREE.MeshStandardMaterial({ color: cor, roughness: 0.3 })
          );
          salto.position.set(0, -0.045, -0.07);
          char.joints[side].add(salto);
        }
      }

      // Mulher 1: Vítima (Vestido Preto Curto)
      const vitima = makeCharacter({
        name: 'vitima',
        skin: '#f3cfae',
        height: 0.96,
        build: 0.88,
        silhouette: 'female',
        top: { color: '#09090b', sleeves: 'short' },
        bottom: { color: '#09090b', type: 'skirt' },
        shoes: '#09090b',
        hair: { style: 'long', color: '#c2410c' }
      });
      addSaltoAlto(vitima, '#000000');
      vitima.root.position.set(0.6, 0, 0);
      vitima.root.rotation.y = Math.PI / 2;
      scene.add(vitima.root);

      // Mulher 2: Infratora do Carrinho (Vestido Vermelho Curto e Salto Alto)
      const atacante = makeCharacter({
        name: 'atacante',
        skin: '#e0ac69',
        height: 0.98,
        build: 0.92,
        silhouette: 'female',
        top: { color: '#dc2626', sleeves: 'short' },
        bottom: { color: '#dc2626', type: 'skirt' },
        shoes: '#dc2626',
        hair: { style: 'ponytail', color: '#171717' }
      });
      addSaltoAlto(atacante, '#991b1b');
      atacante.root.position.set(-3.5, 0, 0);
      atacante.root.rotation.y = Math.PI / 2;
      scene.add(atacante.root);

      // Juiz de Futebol (Camisa Amarela com Textura Procedural, Short Preto, Relógio)
      const juiz = makeCharacter({
        name: 'juiz',
        skin: '#381e0f',
        height: 1.06,
        build: 1.05,
        silhouette: 'male',
        top: {
          color: '#eab308',
          sleeves: 'short',
          draw: (ctx, W, H) => {
            // Costura sutil dos bolsos no peito
            ctx.strokeStyle = 'rgba(0,0,0,0.22)';
            ctx.lineWidth = 3;
            ctx.strokeRect(W * 0.31, H * 0.16, W * 0.13, H * 0.17);
            ctx.strokeRect(W * 0.56, H * 0.16, W * 0.13, H * 0.17);

            // Escudo esquerdo (Arbitragem Paulista estilizado)
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(W * 0.33, H * 0.18, W * 0.09, H * 0.12);
            ctx.fillStyle = '#dc2626';
            ctx.fillRect(W * 0.37, H * 0.23, W * 0.05, H * 0.07);
            ctx.fillStyle = '#18181b';
            ctx.font = 'bold 11px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('ARB', W * 0.375, H * 0.215);

            // Escudo direito (FPF estilizado)
            ctx.fillStyle = '#dc2626';
            ctx.fillRect(W * 0.58, H * 0.18, W * 0.09, H * 0.055);
            ctx.fillStyle = '#facc15';
            ctx.font = 'bold 15px sans-serif';
            ctx.fillText('FPF', W * 0.625, H * 0.222);
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(W * 0.58, H * 0.235, W * 0.09, H * 0.065);
            ctx.fillStyle = '#18181b';
            for (let i = 0; i < 4; i++) {
              ctx.fillRect(W * (0.585 + i * 0.022), H * 0.235, W * 0.011, H * 0.065);
            }

            // Patrocínio central (ODONTO company estilizado)
            ctx.fillStyle = '#18181b';
            ctx.fillRect(W * 0.35, H * 0.36, W * 0.30, H * 0.105);
            ctx.fillStyle = '#f8fafc';
            ctx.font = 'bold 26px sans-serif';
            ctx.fillText('ODONTO', W * 0.50, H * 0.415);
            ctx.font = 'bold 17px sans-serif';
            ctx.fillText('company', W * 0.50, H * 0.452);
          }
        },
        bottom: { color: '#18181b', type: 'shorts' },
        shoes: '#09090b',
        hair: { style: 'bald' }
      });

      // Relógio no pulso esquerdo do juiz
      const relogioGroup = new THREE.Group();
      const pulseira = new THREE.Mesh(
        new THREE.CylinderGeometry(0.058, 0.058, 0.036, 12),
        new THREE.MeshStandardMaterial({ color: '#111827', roughness: 0.5 })
      );
      relogioGroup.add(pulseira);
      const caixaRelogio = new THREE.Mesh(
        new THREE.BoxGeometry(0.048, 0.046, 0.018),
        new THREE.MeshStandardMaterial({ color: '#374151', metalness: 0.6, roughness: 0.3 })
      );
      caixaRelogio.position.set(0, 0, 0.056);
      relogioGroup.add(caixaRelogio);
      const visorRelogio = new THREE.Mesh(
        new THREE.PlaneGeometry(0.036, 0.034),
        new THREE.MeshStandardMaterial({ color: '#0f172a', emissive: '#38bdf8', emissiveIntensity: 0.35 })
      );
      visorRelogio.position.set(0, 0, 0.066);
      relogioGroup.add(visorRelogio);
      relogioGroup.position.set(0, -0.20, 0);
      juiz.joints.forearmL.add(relogioGroup);

      const apitoGroup = new THREE.Group();
      const apitoCorpo = new THREE.Mesh(
        new THREE.CylinderGeometry(0.015, 0.018, 0.06, 8),
        new THREE.MeshStandardMaterial({ color: '#d1d5db', metalness: 0.8, roughness: 0.2 })
      );
      apitoCorpo.rotation.x = Math.PI / 2;
      apitoGroup.add(apitoCorpo);
      apitoGroup.position.set(0, 0.08, 0.24);
      juiz.joints.head.add(apitoGroup);

      const cartaoVermelho = new THREE.Mesh(
        new THREE.BoxGeometry(0.09, 0.14, 0.004),
        new THREE.MeshStandardMaterial({
          color: '#ef4444',
          roughness: 0.2,
          emissive: '#dc2626',
          emissiveIntensity: 0.3
        })
      );
      cartaoVermelho.position.set(0, -0.10, 0.02);
      cartaoVermelho.rotation.set(0.15, 0, 0);
      cartaoVermelho.visible = false;
      juiz.joints.handR.add(cartaoVermelho);

      juiz.root.position.set(0, 0, 5.0);
      juiz.root.visible = false;
      scene.add(juiz.root);

      // ==========================================
      // 3.5 RETARGETING GENÉRICO MIXAMO FBX -> SKELETON.JS
      // ==========================================
      const MIXAMO_TO_JOINT_ALL = [
        ['hips', 'mixamorigHips'],
        ['spine', 'mixamorigSpine'],
        ['chest', 'mixamorigSpine2'],
        ['neck', 'mixamorigNeck'],
        ['head', 'mixamorigHead'],
        ['armL', 'mixamorigLeftArm'],
        ['forearmL', 'mixamorigLeftForeArm'],
        ['handL', 'mixamorigLeftHand'],
        ['armR', 'mixamorigRightArm'],
        ['forearmR', 'mixamorigRightForeArm'],
        ['handR', 'mixamorigRightHand'],
        ['legL', 'mixamorigLeftUpLeg'],
        ['shinL', 'mixamorigLeftLeg'],
        ['footL', 'mixamorigLeftFoot'],
        ['legR', 'mixamorigRightUpLeg'],
        ['shinR', 'mixamorigRightLeg'],
        ['footR', 'mixamorigRightFoot'],
      ];

      const _qSrc = new THREE.Quaternion();
      const _qParent = new THREE.Quaternion();
      const _qRoot = new THREE.Quaternion();
      const _qTarget = new THREE.Quaternion();
      const _vHips = new THREE.Vector3();
      const _qLeftArmOffset = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), Math.PI / 2);
      const _qRightArmOffset = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), -Math.PI / 2);
      const fbxLoader = new FBXLoader();

      function createMixamoRetargeter(fbxUrl, excludeJoints = []) {
        const excluded = new Set(excludeJoints);
        const state = {
          fbxRoot: null,
          mixer: null,
          duration: 1.0,
          bones: {},
          restInv: {},
          restHipsY: 100,
          apply(character, timeSec, loop = true) {
            if (!state.fbxRoot || !state.mixer) return;
            const t = loop ? (timeSec % state.duration) : Math.min(timeSec, state.duration - 0.001);
            state.mixer.setTime(t);
            state.fbxRoot.updateMatrixWorld(true);
            character.root.updateMatrixWorld(true);
            character.root.getWorldQuaternion(_qRoot);

            const hipsBone = state.bones['mixamorigHips'];
            if (hipsBone) {
              hipsBone.getWorldPosition(_vHips);
              const scale = 0.68 / (state.restHipsY || 100);
              character.joints.hips.position.set(_vHips.x * scale, _vHips.y * scale, _vHips.z * scale);
            }

            for (const [jointName, mixamoName] of MIXAMO_TO_JOINT_ALL) {
              if (excluded.has(jointName)) continue;
              const srcBone = state.bones[mixamoName];
              const tgtJoint = character.joints[jointName];
              const rInv = state.restInv[mixamoName];
              if (!srcBone || !tgtJoint || !rInv) continue;

              srcBone.getWorldQuaternion(_qSrc);
              _qTarget.copy(_qSrc).multiply(rInv);
              if (jointName === 'armL' || jointName === 'forearmL' || jointName === 'handL') {
                _qTarget.multiply(_qLeftArmOffset);
              } else if (jointName === 'armR' || jointName === 'forearmR' || jointName === 'handR') {
                _qTarget.multiply(_qRightArmOffset);
              }
              _qTarget.premultiply(_qRoot);

              tgtJoint.parent.getWorldQuaternion(_qParent);
              tgtJoint.quaternion.copy(_qParent).invert().multiply(_qTarget);
              tgtJoint.updateMatrixWorld(false);
            }
          }
        };

        fbxLoader.load(fbxUrl, (fbx) => {
          state.fbxRoot = fbx;
          fbx.visible = false;
          scene.add(fbx);
          fbx.updateMatrixWorld(true);
          fbx.traverse((child) => {
            if (child.isBone || child.name.startsWith('mixamorig')) {
              state.bones[child.name.replace(':', '')] = child;
            }
          });
          for (const [, mixamoName] of MIXAMO_TO_JOINT_ALL) {
            const b = state.bones[mixamoName];
            if (b) state.restInv[mixamoName] = b.getWorldQuaternion(new THREE.Quaternion()).invert();
          }
          if (state.bones['mixamorigHips']) {
            const p = state.bones['mixamorigHips'].getWorldPosition(new THREE.Vector3());
            if (p.y > 1) state.restHipsY = p.y;
          }
          if (fbx.animations && fbx.animations.length > 0) {
            const clip = fbx.animations[0];
            state.duration = clip.duration || 1.0;
            state.mixer = new THREE.AnimationMixer(fbx);
            const act = state.mixer.clipAction(clip);
            act.setLoop(THREE.LoopRepeat);
            act.play();
          }
        });

        return state;
      }

      const correndoRetargeter = createMixamoRetargeter('./assets/animations/correndo.fbx');
      const carrinhoRetargeter = createMixamoRetargeter('./assets/animations/carrinho.fbx');
      const levandoRetargeter = createMixamoRetargeter('./assets/animations/levando-carrinho.fbx');
      const capoeiraRetargeter = createMixamoRetargeter('./assets/animations/capoeira.fbx', ['armR', 'forearmR', 'handR']);
      const salsaRetargeter = createMixamoRetargeter('./assets/animations/salsa.fbx');
      const machucadoRetargeter = createMixamoRetargeter('./assets/animations/machucado-chao.fbx');

      function resetPose(character) {
        character.joints.hips.position.set(0, 0.68, 0);
        for (const j of Object.values(character.joints)) {
          j.quaternion.identity();
        }
      }

      // ==========================================
      // 4. TIMELINE GSAP (CENA 1 + CENA 2)
      // ==========================================
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ------------------------------------------
      // CENA 1: 0.0s a 3.10s (CORRENDO + CARRINHO + LEVANDO CARRINHO + CÂMERA SEGUINDO)
      // ------------------------------------------
      tl.set(juiz.root, { visible: false }, 0);
      tl.set(vitima.root, { visible: true }, 0);
      tl.set(atacante.root, { visible: true }, 0);
      tl.set(vitima.root.rotation, { x: 0, y: Math.PI / 2, z: 0 }, 0);
      tl.set(vitima.root.position, { x: -0.5, y: 0, z: 0 }, 0);
      tl.set(vitima.joints.hips.position, { x: 0, y: 0.68, z: 0 }, 0);
      tl.set(atacante.root.rotation, { x: 0, y: Math.PI / 2, z: 0 }, 0);
      tl.set(atacante.root.position, { x: -3.4, y: 0, z: 0 }, 0);
      tl.set(atacante.joints.hips.position, { x: 0, y: 0.68, z: 0 }, 0);

      tl.to(bola.position, { x: 1.3, z: 0, duration: 1.5, ease: "power1.out" }, 0);
      tl.to(vitima.root.position, { x: 0.6, duration: 1.5, ease: "none" }, 0);
      tl.to(atacante.root.position, { x: -2.0, duration: 0.85, ease: "none" }, 0);

      // O Carrinho via carrinho.fbx (0.85s -> 2.61s)
      const atacanteCarrinhoState = { t: 0 };
      tl.set(atacanteCarrinhoState, { t: 0 }, 0);
      tl.to(atacanteCarrinhoState, {
        t: 1.76,
        duration: 1.76,
        ease: "none",
        onUpdate: () => {
          carrinhoRetargeter.apply(atacante, atacanteCarrinhoState.t, false);
        }
      }, 0.85);

      // Vítima levando o carrinho e caindo via levando-carrinho.fbx (1.50s -> 3.10s)
      const vitimaLevandoState = { t: 0 };
      tl.set(vitimaLevandoState, { t: 0 }, 0);
      tl.to(vitimaLevandoState, {
        t: 1.60,
        duration: 1.60,
        ease: "none",
        onUpdate: () => {
          levandoRetargeter.apply(vitima, vitimaLevandoState.t, false);
        }
      }, 1.50);

      tl.to(bola.position, { x: 4.8, y: 0.9, z: -1.5, duration: 1.4, ease: "power2.out" }, 1.50);

      // ------------------------------------------
      // CENA 2: 3.10s a 8.10s (CORTE DIRETO PARA O JUIZ NA CAPOEIRA COM CARTÃO)
      // ------------------------------------------
      const CUT_AT = 3.10;
      tl.set(vitima.root, { visible: false }, CUT_AT);
      tl.set(atacante.root, { visible: false }, CUT_AT);
      tl.set(juiz.root, { visible: true }, CUT_AT);
      tl.set(juiz.root.position, { x: 0, y: 0, z: 0 }, CUT_AT);
      tl.set(apitoGroup, { visible: false }, CUT_AT);
      tl.set(cartaoVermelho, { visible: true }, CUT_AT);
      tl.set(juiz.joints.armR.rotation, { x: 2.75, y: 0.05, z: 0.12 }, CUT_AT);
      tl.set(juiz.joints.forearmR.rotation, { x: 0.15, y: 0, z: 0 }, CUT_AT);
      tl.set(juiz.joints.handR.rotation, { x: 0, y: 0, z: 0 }, CUT_AT);
      tl.set(camTarget, { x: -0.1, y: 1.05, z: 0 }, CUT_AT);

      tl.call(() => {
        applyFaceState(juiz, {
          eyeOpen: 1.15,
          browRaise: 0.2,
          browTilt: 0.2,
          smile: 0.7,
          mouthOpen: 0.1
        });
      }, null, CUT_AT);

      tl.fromTo(camera.position,
        { x: -0.35, y: 1.35, z: 5.1 },
        { x: 0.15, y: 1.3, z: 4.6, duration: 4.8, ease: "power1.inOut", immediateRender: false },
        CUT_AT
      );

      const juizCapoeiraState = { t: 0 };
      tl.fromTo(juizCapoeiraState,
        { t: 0 },
        {
          t: 5.0,
          duration: 5.0,
          ease: "none",
          onUpdate: () => {
            capoeiraRetargeter.apply(juiz, juizCapoeiraState.t, true);
          }
        },
        CUT_AT
      );

      // ------------------------------------------
      // CENA 3: 8.10s a 13.10s (PLANO ABERTO: SALSA + MACHUCADA NO CHÃO + JUIZ OLHANDO)
      // ------------------------------------------
      const SCENE3_AT = 8.10;
      tl.set(vitima.root, { visible: true }, SCENE3_AT);
      tl.set(atacante.root, { visible: true }, SCENE3_AT);
      tl.set(juiz.root, { visible: true }, SCENE3_AT);

      tl.set(atacante.root.position, { x: -0.95, y: 0, z: 0.25 }, SCENE3_AT);
      tl.set(atacante.root.rotation, { x: 0, y: 0.25, z: 0 }, SCENE3_AT);

      tl.set(vitima.root.position, { x: 0.45, y: 0, z: 1.05 }, SCENE3_AT);
      tl.set(vitima.root.rotation, { x: 0, y: -0.35, z: 0 }, SCENE3_AT);

      tl.set(juiz.root.position, { x: 0.72, y: 0, z: -0.55 }, SCENE3_AT);
      tl.set(juiz.root.rotation, { x: 0, y: -0.35, z: 0 }, SCENE3_AT);
      tl.set(cartaoVermelho, { visible: true }, SCENE3_AT);

      tl.set(camera.position, { x: 0, y: 1.55, z: 7.6 }, SCENE3_AT);
      tl.set(camTarget, { x: 0, y: 0.85, z: 0.1 }, SCENE3_AT);

      tl.call(() => {
        applyFaceState(atacante, { smile: 0.9, eyeOpen: 1.1 });
        applyFaceState(vitima, { eyeOpen: 0.3, browRaise: 0.5, browTilt: 0.6, smile: -0.8, mouthOpen: 0.6 });
        applyFaceState(juiz, { eyeOpen: 1.2, browRaise: -0.5, browTilt: -0.7, smile: -0.6, mouthOpen: 0.2 });
      }, null, SCENE3_AT);

      const scene3AnimState = { t: 0 };
      tl.fromTo(scene3AnimState,
        { t: 0 },
        { t: 5.0, duration: 5.0, ease: "none" },
        SCENE3_AT
      );

      // Registra a timeline no HyperFrames
      window.__timelines["main"] = tl;
      tl.seek(0);

      // Loop do Three.js
      const _pAtacante = new THREE.Vector3();
      const _pVitima = new THREE.Vector3();
      function smoothstep01(e0, e1, x) {
        const u = Math.max(0, Math.min(1, (x - e0) / (e1 - e0)));
        return u * u * (3 - 2 * u);
      }

      function loop() {
        const t = tl.time();
        if (t < CUT_AT) {
          if (t < 0.85) {
            correndoRetargeter.apply(atacante, t, true);
          } else {
            carrinhoRetargeter.apply(atacante, t - 0.85, false);
          }
          if (t < 1.50) {
            correndoRetargeter.apply(vitima, t + 0.25, true);
          } else {
            levandoRetargeter.apply(vitima, t - 1.50, false);
          }
          // Câmera segue primeiro a atacante e, após o impacto (1.50s), passa a seguir a vítima
          atacante.joints.hips.getWorldPosition(_pAtacante);
          vitima.joints.hips.getWorldPosition(_pVitima);
          const alpha = smoothstep01(1.45, 1.85, t);
          const fx = THREE.MathUtils.lerp(_pAtacante.x, _pVitima.x, alpha);
          const fy = THREE.MathUtils.lerp(Math.max(0.45, _pAtacante.y), Math.max(0.45, _pVitima.y), alpha);
          const fz = THREE.MathUtils.lerp(_pAtacante.z, _pVitima.z, alpha);
          camTarget.set(fx, fy, fz);
          camera.position.set(fx, 1.25, 6.2);
        } else if (t < SCENE3_AT) {
          capoeiraRetargeter.apply(juiz, t - CUT_AT, true);
        } else {
          // Cena 3: plano aberto com as 2 animações + juiz parado olhando para a mulher de vermelho
          salsaRetargeter.apply(atacante, t - SCENE3_AT, true);
          machucadoRetargeter.apply(vitima, t - SCENE3_AT, true);
          resetPose(juiz);
          juiz.joints.armR.rotation.set(2.75, 0.05, 0.12);
          juiz.joints.forearmR.rotation.set(0.15, 0, 0);
          juiz.joints.head.rotation.set(0.08, -0.55, 0);
          juiz.joints.neck.rotation.set(0, -0.15, 0);
        }
        camera.lookAt(camTarget);
        renderer.render(scene, camera);
        requestAnimationFrame(loop);
      }
      loop();
    </script>
  </body>
</html>
