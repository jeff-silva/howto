<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>ERP Sob Medida - Labscript</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=JetBrains+Mono:wght@600&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>

    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js",
          "three/addons/": "./node_modules/three/examples/jsm/"
        }
      }
    </script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #090d16;
        font-family: "Montserrat", sans-serif;
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }

      #tela3d {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        z-index: 1;
      }

      .vinheta {
        position: absolute;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        background: radial-gradient(circle at 50% 50%, transparent 55%, rgba(4, 7, 14, 0.8) 100%);
      }

      .flash-fx {
        position: absolute;
        inset: 0;
        z-index: 15;
        background: #ffffff;
        opacity: 0;
        pointer-events: none;
      }

      /* Card de status da gestão empresarial */
      .card-erp {
        position: absolute;
        top: 200px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;
        background: rgba(15, 23, 42, 0.92);
        border: 2px solid rgba(14, 165, 233, 0.45);
        padding: 26px 44px;
        border-radius: 28px;
        backdrop-filter: blur(16px);
        box-shadow: 0 25px 70px rgba(0, 0, 0, 0.75);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        opacity: 0;
        transform: translate(-50%, -20px) scale(0.9);
        pointer-events: none;
      }

      .badge-erp {
        font-family: "JetBrains Mono", monospace;
        font-size: 20px;
        color: #38bdf8;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      .title-erp {
        font-size: 44px;
        font-weight: 900;
        color: #ffffff;
        text-align: center;
      }

      .subtitle-erp {
        color: #10b981;
        font-size: 26px;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="12"
      data-width="1080"
      data-height="1920"
    >
      <canvas id="tela3d" data-start="0" data-track-index="0"></canvas>
      <div class="vinheta"></div>
      <div class="flash-fx" data-start="0" data-track-index="1"></div>

      <div class="card-erp clip" data-start="0" data-duration="12">
        <div class="badge-erp">SISTEMA ERP INTEGRADO</div>
        <div class="title-erp">Controle Total do Seu Negócio</div>
        <div class="subtitle-erp">Vendas • Estoque • Financeiro • NF-e</div>
      </div>
    </div>

    <script type="module">
      import * as THREE from 'three';

      // ==========================================
      // 1. SETUP DO THREE.JS (CANVAS 1080x1920)
      // ==========================================
      const canvas = document.getElementById('tela3d');
      const W = 1080;
      const H = 1920;

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#080d1a');
      scene.fog = new THREE.FogExp2('#080d1a', 0.035);

      const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 100);

      // Iluminação Tech / Data Hub
      const hemiLight = new THREE.HemisphereLight('#38bdf8', '#0f172a', 0.9);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight('#ffffff', 3.0);
      dirLight.position.set(6, 15, 8);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 1024;
      dirLight.shadow.mapSize.height = 1024;
      scene.add(dirLight);

      const rimLight = new THREE.DirectionalLight('#10b981', 2.0);
      rimLight.position.set(-8, 6, -6);
      scene.add(rimLight);

      // ==========================================
      // 2. AMBIENTE 3D: HUB CENTRAL & NÓDULOS DE DADOS
      // ==========================================
      const grupoCena = new THREE.Group();
      scene.add(grupoCena);

      // Piso circular com grade geométrica iluminada
      const plataformaGeo = new THREE.CylinderGeometry(5.2, 5.5, 0.4, 48);
      const plataformaMat = new THREE.MeshStandardMaterial({
        color: '#0f172a',
        metalness: 0.5,
        roughness: 0.35
      });
      const plataforma = new THREE.Mesh(plataformaGeo, plataformaMat);
      plataforma.position.y = -0.2;
      plataforma.receiveShadow = true;
      grupoCena.add(plataforma);

      // Anéis de energia concêntricos no piso
      const anelCentral = new THREE.Mesh(
        new THREE.TorusGeometry(5.3, 0.04, 16, 64),
        new THREE.MeshBasicMaterial({ color: '#38bdf8' })
      );
      anelCentral.rotation.x = Math.PI / 2;
      grupoCena.add(anelCentral);

      const anelInterno = new THREE.Mesh(
        new THREE.TorusGeometry(3.0, 0.03, 16, 64),
        new THREE.MeshBasicMaterial({ color: '#10b981' })
      );
      anelInterno.rotation.x = Math.PI / 2;
      grupoCena.add(anelInterno);

      // ==========================================
      // 3. NÚCLEO ERP CENTRAL (DADO MESTRE CONECTADO)
      // ==========================================
      const grupoNucleo = new THREE.Group();
      grupoNucleo.position.y = 1.4;
      grupoCena.add(grupoNucleo);

      // Cubo de Vidro Tecnológico (Core do Sistema)
      const matVidroERP = new THREE.MeshPhysicalMaterial({
        color: '#e0f2fe',
        transmission: 0.88,
        opacity: 1,
        transparent: true,
        roughness: 0.1,
        ior: 1.5,
        thickness: 0.6
      });

      const coreCube = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), matVidroERP);
      coreCube.castShadow = true;
      grupoNucleo.add(coreCube);

      // Esfera de energia interior pulsante
      const matCoreEnergy = new THREE.MeshStandardMaterial({
        color: '#38bdf8',
        emissive: '#0284c7',
        emissiveIntensity: 2.5
      });
      const coreEnergy = new THREE.Mesh(new THREE.IcosahedronGeometry(0.42, 1), matCoreEnergy);
      grupoNucleo.add(coreEnergy);

      // ==========================================
      // 4. MÓDULOS PERIFÉRICOS (Vendas, Estoque, Financeiro, NF-e)
      // ==========================================
      const modulosData = [
        { nome: 'Vendas', cor: '#38bdf8', x: -2.3, z: -1.2, altura: 0.7 },
        { nome: 'Estoque', cor: '#f59e0b', x: 2.3, z: -1.2, altura: 0.9 },
        { nome: 'Financeiro', cor: '#10b981', x: -2.3, z: 1.5, altura: 1.1 },
        { nome: 'Relatórios/NF-e', cor: '#ec4899', x: 2.3, z: 1.5, altura: 0.8 }
      ];

      const grupoModulos = new THREE.Group();
      grupoCena.add(grupoModulos);

      const tubosConexao = [];

      modulosData.forEach((mod) => {
        const modGroup = new THREE.Group();
        modGroup.position.set(mod.x, 0.4, mod.z);

        // Bloco do servidor/módulo
        const modMesh = new THREE.Mesh(
          new THREE.BoxGeometry(0.85, mod.altura, 0.85),
          new THREE.MeshStandardMaterial({
            color: '#1e293b',
            metalness: 0.6,
            roughness: 0.3
          })
        );
        modMesh.position.y = mod.altura / 2;
        modMesh.castShadow = true;
        modMesh.receiveShadow = true;
        modGroup.add(modMesh);

        // Faixa de LED de identificação do módulo
        const ledMesh = new THREE.Mesh(
          new THREE.BoxGeometry(0.88, 0.08, 0.88),
          new THREE.MeshBasicMaterial({ color: mod.cor })
        );
        ledMesh.position.y = mod.altura + 0.02;
        modGroup.add(ledMesh);

        grupoModulos.add(modGroup);

        // Tubo de fibra / fluxo de dados ligando o módulo ao Core
        const pontosLinha = [
          new THREE.Vector3(mod.x, 0.08, mod.z),
          new THREE.Vector3(mod.x * 0.4, 0.08, mod.z * 0.4),
          new THREE.Vector3(0, 0.7, 0)
        ];
        const curva = new THREE.CatmullRomCurve3(pontosLinha);
        const tuboGeo = new THREE.TubeGeometry(curva, 24, 0.035, 8, false);
        const tuboMat = new THREE.MeshStandardMaterial({
          color: mod.cor,
          emissive: mod.cor,
          emissiveIntensity: 1.2
        });
        const tubo = new THREE.Mesh(tuboGeo, tuboMat);
        tubosConexao.push(tubo);
        grupoCena.add(tubo);
      });

      // Gráficos de barras 3D em crescimento no fundo (Dashboard visual)
      const grupoGraficos = new THREE.Group();
      grupoGraficos.position.set(0, 0, -3.2);
      grupoCena.add(grupoGraficos);

      const barras = [];
      const alturasBarras = [1.2, 1.8, 2.3, 3.1, 3.8];
      alturasBarras.forEach((h, i) => {
        const barra = new THREE.Mesh(
          new THREE.BoxGeometry(0.35, 1, 0.35),
          new THREE.MeshStandardMaterial({
            color: '#10b981',
            metalness: 0.4,
            roughness: 0.25,
            emissive: '#047857',
            emissiveIntensity: 0.35
          })
        );
        barra.position.set((i - 2) * 0.55, 0, 0);
        barra.scale.y = 0.01;
        barra.castShadow = true;
        grupoGraficos.add(barra);
        barras.push({ mesh: barra, alturaFinal: h });
      });

      // ==========================================
      // 5. TIMELINE GSAP: ANIMAÇÃO DE CONEXÃO E CRESCIMENTO
      // ==========================================
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Estado inicial: Câmera em ângulo isométrico alto
      tl.set(camera.position, { x: 5.5, y: 7.5, z: 9.0 }, 0);
      tl.call(() => {
        camera.lookAt(0, 1.1, 0);
      }, null, 0);

      // Entrada do Card de Informações
      tl.to(".card-erp", {
        opacity: 1,
        y: 0,
        scale: 1,
        duration: 0.8,
        ease: "back.out(1.5)"
      }, 0.5);

      // Rotação suave contínua do Core ERP e plataforma
      tl.to(coreCube.rotation, {
        y: Math.PI * 4,
        x: Math.PI * 2,
        duration: 12,
        ease: "none"
      }, 0);

      tl.to(grupoCena.rotation, {
        y: Math.PI * 0.8,
        duration: 12,
        ease: "power1.inOut"
      }, 0);

      // Pulso contínuo do núcleo de energia
      tl.to(coreEnergy.scale, {
        x: 1.3,
        y: 1.3,
        z: 1.3,
        duration: 1.0,
        repeat: -1,
        yoyo: true,
        ease: "sine.inOut"
      }, 0);

      // Entrada das barras de crescimento financeiro (gráfico subindo em cascata)
      barras.forEach((b, i) => {
        tl.to(b.mesh.scale, {
          y: b.alturaFinal,
          duration: 1.2,
          ease: "back.out(1.6)"
        }, 1.2 + i * 0.15);

        tl.to(b.mesh.position, {
          y: b.alturaFinal / 2,
          duration: 1.2,
          ease: "back.out(1.6)"
        }, 1.2 + i * 0.15);
      });

      // Zoom cinematográfico aproximando no Core integrado
      tl.to(camera.position, {
        x: 2.2,
        y: 3.5,
        z: 5.2,
        duration: 6,
        ease: "power2.out"
      }, 3.0);

      // Flash sutil nos tubos de dados
      tubosConexao.forEach((tubo, i) => {
        tl.to(tubo.material, {
          emissiveIntensity: 3.0,
          duration: 0.4,
          repeat: 3,
          yoyo: true,
          ease: "power2.inOut"
        }, 2.0 + i * 0.3);
      });

      // Registra a timeline no HyperFrames
      window.__timelines["main"] = tl;
      tl.seek(0);

      // Loop do Three.js mantendo foco no Core
      function loop() {
        camera.lookAt(0, 1.2, 0);
        renderer.render(scene, camera);
        requestAnimationFrame(loop);
      }
      loop();
    </script>
  </body>
</html>
