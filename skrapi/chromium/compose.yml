services:
  chromium:
    image: lscr.io/linuxserver/chromium:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - CHROME_CLI=--remote-debugging-port=9223 --remote-allow-origins=*
    volumes:
      - ./config:/config
    ports:
      - "3001:3000" # Porta para ver a tela do navegador
      - "9222:9222" # Porta para o seu script (Puppeteer) conectar
    shm_size: "2gb"

  socat:
    image: alpine/socat
    network_mode: "service:chromium"
    command: tcp-listen:9222,fork,reuseaddr tcp-connect:127.0.0.1:9223
