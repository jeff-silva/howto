services:
  odoo-web:
    image: odoo:latest
    depends_on: [odoo-db]
    ports: [8069:8069]
    command: odoo --http-interface=0.0.0.0 ${ODOO_EXTRA_ARGS:-}
    environment:
      - PGHOST=odoo-db
      - USER=odoo
      - PASSWORD=myodoo
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons
  odoo-db:
    image: postgres:16
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=myodoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata

  html-server:
    image: nginx:alpine
    ports: [8081:80]
    volumes:
      - ./public:/usr/share/nginx/html:ro

  # pgadmin:
  #   image: dpage/pgadmin4
  #   ports: [5050:80]
  #   depends_on: [odoo-db]
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: main@grr.la
  #     PGADMIN_DEFAULT_PASSWORD: main@grr.la
    

volumes:
  odoo-web-data:
  odoo-db-data:
