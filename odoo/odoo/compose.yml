services:
  odoo-web:
    build: .
    depends_on: [odoo-db]
    ports: [8069:8069]
    environment:
      - HOST=odoo-db
      - PGHOST=odoo-db
      - USER=odoo
      - PASSWORD=myodoo
      - ENVIRONMENT=${ENVIRONMENT:-dev}
    command: >
      sh -c '
        if [ "$$ENVIRONMENT" = "prod" ]; then
          /entrypoint.sh odoo --http-interface=0.0.0.0 -d odoo
        else
          /entrypoint.sh odoo --http-interface=0.0.0.0 -d odoo --dev=xml,reload
        fi
      '
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons
  odoo-db:
    image: postgres:16
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=myodoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata

volumes:
  odoo-web-data:
  odoo-db-data:
