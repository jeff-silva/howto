services:
  browser:
    image: lscr.io/linuxserver/chromium:latest
    container_name: remote_browser
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - CHROME_CLI=--remote-debugging-port=9222 --remote-debugging-address=0.0.0.0
    volumes:
      - ./config:/config # Persiste abas, sessões, senhas e histórico
    ports:
      - "3000:3000" # Interface visual no seu navegador
      - "9222:9222" # Porta para o script Node.js controlar
    shm_size: "2gb"