<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bem-vindo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950 text-white flex items-center justify-center p-6">
  <main class="max-w-2xl w-full bg-white/5 backdrop-blur-xl border border-white/10 rounded-3xl p-8 sm:p-12 shadow-2xl text-center">
    <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium bg-indigo-500/20 text-indigo-300 border border-indigo-400/20 mb-6">
      <span class="w-2 h-2 rounded-full bg-indigo-400 animate-pulse"></span>
      Online &amp; Pronto
    </span>

    <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-200 to-indigo-300 bg-clip-text text-transparent">
      Bem-vindo!
    </h1>

    <p class="mt-4 text-base sm:text-lg text-slate-300 leading-relaxed">
      Este espaço está configurado e pronto para receber seus projetos, documentações e ideias.
    </p>

    <div class="mt-8 flex flex-wrap items-center justify-center gap-4">
      <a href="#explorar" class="px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 transition font-semibold text-sm shadow-lg shadow-indigo-600/30">
        Começar agora
      </a>
      <a href="https://github.com/jeff-silva" target="_blank" rel="noopener noreferrer" class="px-6 py-3 rounded-xl bg-white/10 hover:bg-white/15 border border-white/10 transition font-semibold text-sm text-slate-200">
        GitHub
      </a>
    </div>
  </main>
</body>
</html>
