<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Labscrípit TTS Sync</title>
    <!-- GSAP for animation -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- Load the words generated by edge.sh -->
    <script src="words.js"></script>

    <style>
      :root {
        --cream: #f4efeb;
        --red: #b82823;
        --dark: #222222;
      }
      body {
        margin: 0;
        background: var(--cream);
        color: var(--dark);
        font-family: 'Inter', sans-serif;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 80px;
        box-sizing: border-box;
      }
      
      /* Asterisk decorations */
      .asterisk {
        position: absolute;
        width: 80px;
        height: 80px;
        background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M45,0 h10 v40 h40 v10 h-40 v40 h-10 v-40 h-40 v-10 h40 z" fill="%23b82823" transform="rotate(45 50 50)"/><path d="M45,0 h10 v40 h40 v10 h-40 v40 h-10 v-40 h-40 v-10 h40 z" fill="%23b82823"/></svg>') center/contain no-repeat;
      }

      #captions {
        font-family: 'Mochiy Pop One', sans-serif;
        font-size: 85px;
        text-align: center;
        line-height: 1.4;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 25px;
        z-index: 10;
      }
      
      .word {
        opacity: 0.15; /* Inactive state */
        color: var(--dark);
        transform: scale(0.9);
        transition: opacity 0.1s, color 0.1s, transform 0.1s;
      }
      
      /* GSAP vai alternar essa classe para "word active" no tempo exato */
      .word.active {
        opacity: 1;
        color: var(--red);
        transform: scale(1.1);
      }
      
      /* Highlight passed words so they don't fade back entirely if you prefer */
      .word.passed {
        opacity: 0.5;
        color: var(--dark);
        transform: scale(1);
      }
    </style>
  </head>
  <body>
    <!-- 
      O data-duration será atualizado dinamicamente pelo JS,
      mas definimos um valor padrão caso falhe.
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="30" 
    >
      <!-- O áudio que o edge.sh gerou -->
      <audio id="vo" src="../audio.mp3" data-start="0"></audio>
      
      <div class="asterisk" style="top: 200px; left: 150px; transform: scale(1.5);"></div>
      <div class="asterisk" style="bottom: 300px; right: 150px; transform: scale(0.8);"></div>

      <div id="captions"></div>
    </div>

    <script>
      const words = window.AUDIO_WORDS || [];
      const captionsContainer = document.getElementById('captions');
      
      // Update video duration based on the last word's end time (with a little padding)
      if (words.length > 0) {
        const lastWord = words[words.length - 1];
        // Hyperframes expects duration in seconds (pode ser com casas decimais)
        const totalDuration = lastWord.end + 1.5;
        document.getElementById('root').setAttribute('data-duration', totalDuration);
      }

      // Prepare the GSAP timeline
      const tl = gsap.timeline({ paused: true });
      
      // We animate the asterisks too, just for fun
      tl.from(".asterisk", { scale: 0, rotation: -90, opacity: 0, duration: 1, stagger: 0.2, ease: "back.out(1.5)" }, 0);

      words.forEach((item, index) => {
        // Create a span for each word
        const span = document.createElement('span');
        span.className = 'word';
        span.innerText = item.word;
        captionsContainer.appendChild(span);
        
        // At item.start seconds: add 'active' class
        tl.set(span, { className: 'word active' }, item.start);
        
        // At item.end seconds: remove 'active' and add 'passed' (optional)
        tl.set(span, { className: 'word passed' }, item.end);
      });

      // Register the timeline so Hyperframes can sync its virtual time to it
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
